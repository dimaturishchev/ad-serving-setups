<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad serving setups</title>
<meta name="description" content="Interactive maps of common ad serving setups: who collects bids, how the ad server decides, and where the winning creative's code runs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#17202B;--ink2:#4A5563;--ink3:#7A8594;--line:#D5DBE2;--exec:#C0392B;--focus:#185FA5;--hi:#FFF4C2;
  --prebid-f:#E1F5EE;--prebid-s:#0F6E56;--prebid-t:#085041;--prebid-u:#0F6E56;
  --gam-f:#F4F3FE;--gam-s:#534AB7;--gam-t:#3C3489;--gam-u:#534AB7;
  --google-f:#F1EFE8;--google-s:#5F5E5A;--google-t:#2C2C2A;--google-u:#5F5E5A;
  --pub-f:#E8EEF3;--pub-s:#4E6A82;--pub-t:#2A3D4F;--pub-u:#4E6A82;
  --amazon-f:#FAEEDA;--amazon-s:#854F0B;--amazon-t:#633806;--amazon-u:#854F0B;
  --magnite-f:#FAECE7;--magnite-s:#993C1D;--magnite-t:#712B13;--magnite-u:#993C1D;
  --app-f:#E6F1FB;--app-s:#185FA5;--app-t:#0C447C;--app-u:#185FA5;
  --video-f:#FBEAF0;--video-s:#993556;--video-t:#72243E;--video-u:#993556;
  --net-f:#EEF4DD;--net-s:#5B7A1A;--net-t:#3D5410;--net-u:#5B7A1A;
  --page-f:#FFFFFF;--page-s:#7A8594;--page-t:#17202B;--page-u:#4A5563;
  --frame-f:transparent;--frame-s:#AAB3BF;--frame-t:#4A5563;--frame-u:#7A8594;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161C;--surface:#1A2029;--ink:#E7ECF2;--ink2:#A9B4C2;--ink3:#7D8896;--line:#2C3643;--exec:#F07167;--focus:#85B7EB;--hi:#4A3F10;
  --prebid-f:#0B3D32;--prebid-s:#5DCAA5;--prebid-t:#E1F5EE;--prebid-u:#9FE1CB;
  --gam-f:#1E1B3A;--gam-s:#7F77DD;--gam-t:#CECBF6;--gam-u:#AFA9EC;
  --google-f:#2C2C2A;--google-s:#B4B2A9;--google-t:#F1EFE8;--google-u:#D3D1C7;
  --pub-f:#1C2833;--pub-s:#8DA9C2;--pub-t:#E1E9F0;--pub-u:#B3C7D8;
  --amazon-f:#4A2E08;--amazon-s:#EF9F27;--amazon-t:#FAEEDA;--amazon-u:#FAC775;
  --magnite-f:#4A1B0C;--magnite-s:#F0997B;--magnite-t:#FAECE7;--magnite-u:#F5C4B3;
  --app-f:#0C2E52;--app-s:#85B7EB;--app-t:#E6F1FB;--app-u:#B5D4F4;
  --video-f:#4B1528;--video-s:#ED93B1;--video-t:#FBEAF0;--video-u:#F4C0D1;
  --net-f:#26330C;--net-s:#A8CB5C;--net-t:#EEF4DD;--net-u:#C9E08F;
  --page-f:#1A2029;--page-s:#7D8896;--page-t:#E7ECF2;--page-u:#A9B4C2;
  --frame-s:#46505E;--frame-t:#A9B4C2;--frame-u:#7D8896;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-0.01em}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--ink3)}
.crumbs a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{color:var(--ink);border-color:var(--ink3)}
.crumbs span.cur{color:var(--ink)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;min-height:calc(100vh - 62px)}
.layout>*{min-width:0}
nav{border-right:1px solid var(--line);padding:18px 14px;font-size:14px}
nav ul{list-style:none;margin:0;padding:0 0 0 12px}
nav>ul{padding:0}
nav li{margin:2px 0}
nav a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink2);text-decoration:none}
nav a:hover{background:var(--line);color:var(--ink)}
nav a.on{background:var(--ink);color:var(--bg)}
main{padding:24px 28px;display:flex;justify-content:center;align-items:flex-start}
#canvas{width:100%;max-width:760px}
#canvas svg{width:100%;height:auto;display:block}
aside{border-left:1px solid var(--line);background:var(--surface);padding:24px 24px 40px;overflow-wrap:anywhere}
aside h2{font-size:20px;font-weight:500;margin:0 0 8px;letter-spacing:-0.01em}
aside h3{font-size:15px;font-weight:500;margin:22px 0 6px}
aside p{margin:0 0 10px;color:var(--ink2);max-width:62ch}
aside code,.gloss code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 4px;border-radius:4px;color:var(--ink)}
abbr.gt{text-decoration:underline dotted var(--ink3);text-underline-offset:3px;cursor:help}
.sel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:16px 0;background:var(--bg)}
.sel h3{margin-top:0}
.sel .exec{color:var(--exec);font-size:13.5px;margin:6px 0 0}
.sel.empty{color:var(--ink3);font-size:14px}
.codeblock{margin:10px 0 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codeblock .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;color:var(--ink2);background:var(--bg);border-bottom:1px solid var(--line)}
.codeblock .bar span{padding-right:10px}
.codeblock button{white-space:nowrap;flex-shrink:0;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.codeblock button:hover{border-color:var(--ink3)}
.codeblock pre code{background:none;padding:0;font-size:inherit}
.codeblock pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--surface);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid}
.legend i.x{border:1.5px dashed var(--exec);background:transparent}
.legend i.d{border-radius:50%}
details.terms{margin:18px 0 0;border-top:1px solid var(--line);padding-top:12px}
details.terms summary{cursor:pointer;font-weight:500;font-size:15px}
.terms dl,.gloss dl{margin:10px 0 0}
.terms dt,.gloss dt{font-weight:500;font-size:14px;margin-top:10px;border-radius:4px}
.terms dd,.gloss dd{margin:2px 0 0;color:var(--ink2);font-size:14px}
.terms dt.flash{background:var(--hi)}
.sources{margin:18px 0 0;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.sources h3{margin:0 0 6px}
.sources ul{margin:0;padding-left:18px;color:var(--ink2)}
.sources a{color:var(--ink2)}
.gloss{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 22px 20px}
.gloss dt{font-size:15px;margin-top:16px}
.gloss .on{font-size:13px;color:var(--ink3);margin-top:2px}
.gloss .on a{color:var(--ink3)}
/* svg */
svg text{font-family:var(--sans)}
.n{cursor:default}
.n.clk{cursor:pointer}
.n rect.b{fill:var(--f);stroke:var(--s);stroke-width:0.8}
.n.clk:hover rect.b{stroke-width:1.6}
.n.on rect.b{stroke-width:2.2}
.n:focus{outline:none}
.n:focus-visible rect.b{stroke:var(--focus);stroke-width:2.4}
.n rect.x{fill:none;stroke:var(--exec);stroke-width:1.4;stroke-dasharray:5 3}
.tt{font-size:13.5px;font-weight:500;fill:var(--t)}
.tu{font-size:12px;fill:var(--u)}
.dr circle{fill:var(--s)}
.dr path{stroke:var(--f);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.g rect{fill:var(--f);stroke:var(--s);stroke-width:0.8}
.g.frame rect{stroke-dasharray:4 4}
.g.clk{cursor:pointer}
.g.clk:hover rect{stroke-width:1.6}
.g.on rect{stroke-width:2.2}
.g:focus{outline:none}
.g:focus-visible rect{stroke:var(--focus);stroke-width:2.4}
.gl{font-size:13.5px;font-weight:500;fill:var(--t)}
.e{stroke:var(--ink3);stroke-width:1.2;fill:none}
.ll{stroke:var(--ink3);stroke-width:0.8;stroke-dasharray:4 4}
.ml{font-size:12px;fill:var(--ink2)}
.el{font-size:12px;fill:var(--ink2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.k-prebid{--f:var(--prebid-f);--s:var(--prebid-s);--t:var(--prebid-t);--u:var(--prebid-u)}
.k-gam{--f:var(--gam-f);--s:var(--gam-s);--t:var(--gam-t);--u:var(--gam-u)}
.k-google{--f:var(--google-f);--s:var(--google-s);--t:var(--google-t);--u:var(--google-u)}
.k-pub{--f:var(--pub-f);--s:var(--pub-s);--t:var(--pub-t);--u:var(--pub-u)}
.k-amazon{--f:var(--amazon-f);--s:var(--amazon-s);--t:var(--amazon-t);--u:var(--amazon-u)}
.k-magnite{--f:var(--magnite-f);--s:var(--magnite-s);--t:var(--magnite-t);--u:var(--magnite-u)}
.k-app,.k-xandr{--f:var(--app-f);--s:var(--app-s);--t:var(--app-t);--u:var(--app-u)}
.k-video{--f:var(--video-f);--s:var(--video-s);--t:var(--video-t);--u:var(--video-u)}
.k-net{--f:var(--net-f);--s:var(--net-s);--t:var(--net-t);--u:var(--net-u)}
.k-page,.k-step{--f:var(--page-f);--s:var(--page-s);--t:var(--page-t);--u:var(--page-u)}
.k-frame{--f:var(--frame-f);--s:var(--frame-s);--t:var(--frame-t);--u:var(--frame-u)}
@media (max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px 12px}header{padding:14px 16px}.gloss{padding:4px 14px 16px}}
</style>
</head>
<body>
<header>
  <h1>Ad serving setups</h1>
  <div class="crumbs" id="crumbs"></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="All maps"></nav>
  <main><div id="canvas"></div></main>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script>
/* ---------- category labels (legend) ---------- */
const CATS = {
  page:'Publisher page / app code', gam:'Ad server', pub:"Publisher's own campaigns", google:"Google's programmatic demand",
  prebid:'Prebid', amazon:'Amazon TAM/UAM', magnite:'Magnite Fastlane', app:'App SDK', xandr:'Microsoft Monetize',
  video:'Video player / stitcher', net:'Ad network / SSP'
};

/* ---------- reusable snippets ---------- */
const SNIP = {
  pbjsGam:`pbjs.que.push(function () {
  pbjs.addAdUnits(adUnits);
  pbjs.requestBids({
    timeout: 1000,
    bidsBackHandler: function () {
      googletag.cmd.push(function () {
        pbjs.setTargetingForGPTAsync();   // hb_pb, hb_bidder, hb_adid ... on the GPT slots
        googletag.pubads().refresh();     // GAM request now carries the keys
      });
    }
  });
});
// GPT was set up with googletag.pubads().disableInitialLoad(),
// so no GAM request goes out until refresh() above.`,
  puc:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/%%PATTERN:hb_format%%.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = "";
  ucTagData.pubUrl = "%%PATTERN:url%%";
  ucTagData.targetingMap = %%PATTERN:TARGETINGMAP%%;
  ucTagData.hbPb = "%%PATTERN:hb_pb%%";
  ucTagData.hbFormat = "%%PATTERN:hb_format%%";
  ucTagData.adId = "%%PATTERN:hb_adid%%";
  try {
    ucTag.renderAd(document, ucTagData);
  } catch (e) {
    console.log(e);
  }
<\/script>`,
  pucCache:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/%%PATTERN:hb_format%%.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = "";
  ucTagData.pubUrl = "%%PATTERN:url%%";
  ucTagData.cacheHost = "%%PATTERN:hb_cache_host%%";
  ucTagData.cachePath = "%%PATTERN:hb_cache_path%%";
  ucTagData.uuid = "%%PATTERN:hb_cache_id%%";
  ucTagData.mediaType = "%%PATTERN:hb_format%%";
  ucTagData.env = "%%PATTERN:hb_env%%";
  ucTagData.size = "%%PATTERN:hb_size%%";
  ucTagData.hbPb = "%%PATTERN:hb_pb%%";
  try { ucTag.renderAd(document, ucTagData); } catch (e) { console.log(e); }
<\/script>`,
  legacy:`<script>
  // Old pre-PUC creative: only works when the iframe is same-origin (no SafeFrame)
  var w = window;
  for (var i = 0; i < 10; i++) {
    w = w.parent;
    if (w.pbjs) {
      try { w.pbjs.renderAd(document, '%%PATTERN:hb_adid%%'); break; } catch (e) { continue; }
    }
  }
<\/script>`
};

/* ---------- shared explanations ---------- */
const INFO = {
  direct:`<p>Campaigns the publisher sold directly to advertisers, with a promised number of impressions (sponsorship and standard line items). They sit above every non-guaranteed line item, so a guaranteed campaign that still needs the impression takes it, whatever header bidding or programmatic buyers offer.</p><p>One exception: through dynamic allocation, AdX can take an impression from a standard line item when it pays more, as long as the campaign stays on pace.</p>`,
  adx:`<p>Google's own programmatic demand: AdX buyers (Google Ads advertisers, DV360 and third-party DSPs) plus Open Bidding exchanges, all bidding inside GAM's unified auction.</p><p>Through dynamic allocation they compete with the publisher's non-guaranteed line items for every impression and win only when they pay more than the best eligible one.</p>`,
  adxHB:`<p>Google's own programmatic demand: AdX buyers (Google Ads advertisers, DV360 and third-party DSPs) plus Open Bidding exchanges, all bidding inside GAM's unified auction.</p><p>Through dynamic allocation they compete with the non-guaranteed line items, including the header bidding line item, and win only when they pay more. That's why header bidding raises what Google's buyers pay: the header bid sets a real floor.</p>`,
  wins:`<p>GAM applies line item priority first: guaranteed campaigns that need the impression win outright. Among the rest, the highest price wins, and AdX and Open Bidding compete on price against the non-guaranteed line items.</p>`,
  winsHB:`<p>GAM applies line item priority first: guaranteed campaigns that need the impression win outright. Among the rest, the highest price wins. The header bidding line item competes as a price-priority line item at the bucket price it was set up with, and AdX and Open Bidding compete against it on price.</p>`,
  gamWins:`<p>The header bidding line item lost. The ad server serves the winner instead, a direct campaign or an AdX ad, and that creative's code runs in the slot. The header bid is never rendered.</p>`,
  gamAuction:`<p>One ad request, one decision. GAM filters every line item by targeting (ad unit, size, key-values, geography, frequency caps), then applies priority. A guaranteed line item that needs the impression takes it; otherwise the remaining line items and Google's programmatic demand (AdX, Open Bidding) compete on price.</p><p>Header bidding can only enter this box through line items, or through yield groups with header bidding trafficking. It never bids here directly.</p>`,
  s2sBidder:`<p>An SSP called server-to-server by Prebid Server, not by the browser. It sees the device IP address and user agent only if Prebid Server forwards them, and it recognizes the user only if a cookie sync ran earlier. That's the main reason server-side bids can be worth less.</p>`
};

/* ---------- glossary: every term used on the maps, in plain words ---------- */
/* a: aliases matched in map text (case-sensitive when they contain capitals; trailing "s" allowed) */
const GLOSS = [
  {t:'Ad network',a:['ad network','network SDK'],d:'A company that sells ads into apps through its own SDK, such as Meta Audience Network, Unity Ads or Liftoff.'},
  {t:'Ad pod',a:['ad pod','pod'],d:'A group of ads played one after another in a single video ad break.'},
  {t:'Real Time Config (RTC)',a:['RTC','Real Time Config','rtc-config'],d:'The AMP feature that lets an amp-ad tag call a few vendor URLs (such as Prebid Server) before the ad request and add their key-values to it.'},
  {t:'Ad server',a:['ad server'],d:"The system that makes the final choice for an ad slot. It stores the publisher's campaigns, receives each ad request, picks the winner and returns its creative. GAM and Microsoft Monetize are ad servers."},
  {t:'Ad unit',a:['ad unit'],d:'A named ad placement (for example /1234/homepage/top) that campaigns target. In Prebid, the per-slot configuration of sizes, formats and bidders.'},
  {t:'AdMob',a:['AdMob'],d:"Google's ad platform for apps: an ad network plus a mediation platform that can call other networks."},
  {t:'AdSense',a:['AdSense'],d:'Google’s self-serve ad program for sites without an ad server. Google fills the slots and pays the publisher a share.'},
  {t:'AdX (Google Ad Exchange)',a:['AdX','Ad Exchange'],d:"Google's exchange where programmatic buyers bid for publisher impressions, reached through GAM or AdSense."},
  {t:'Amazon TAM / UAM',a:['TAM','UAM'],d:"Amazon's header bidding services. Transparent Ad Marketplace (TAM) is for large publishers that contract with each SSP themselves; Unified Ad Marketplace (UAM) is managed by Amazon, which pays the publisher and takes a fee."},
  {t:'Amazon Publisher Services (APS)',a:['APS','Amazon Publisher Services'],d:"Amazon's publisher business: TAM and UAM on the web, and the APS SDK for in-app bidding."},
  {t:'AMP',a:['AMP'],d:"Accelerated Mobile Pages: Google's restricted HTML format for fast mobile pages. Pages can't run their own JavaScript, so ads load through the amp-ad component."},
  {t:'apstag',a:['apstag'],d:"Amazon's page library for TAM/UAM: it requests Amazon bids, sets them on GPT slots and renders a winning Amazon ad."},
  {t:'AST (AppNexus Seller Tag)',a:['AST','apntag'],d:"Microsoft Monetize's ad tag library for web pages (global object apntag), the counterpart of GPT for GAM. It defines slots, sends the ad request and shows the result."},
  {t:'Bid token',a:['bid token','token'],d:'An encrypted blob of device and user signals that an ad network SDK produces on the device, so the network can bid server-side without being called from the app.'},
  {t:'bidWon',a:['bidWon'],d:'The Prebid.js event fired when a Prebid bid is actually rendered. Analytics adapters use it to count wins.'},
  {t:'Cookie sync',a:['cookie sync'],d:"The process of matching one company's user ID with another's through redirects in the browser, so server-side bidders can recognize the user."},
  {t:'CPM',a:['CPM'],d:'Cost per mille: the price for one thousand impressions. Bids and line item prices are quoted in CPM.'},
  {t:'Creative',a:['creative'],d:'The ad itself as the ad server delivers it: HTML and scripts, an image, or a VAST document for video.'},
  {t:'CTV',a:['CTV','connected TV'],d:'Connected TV: smart TVs and streaming devices that play video apps.'},
  {t:'DAI (Dynamic Ad Insertion)',a:['DAI'],d:"Google's server-side ad insertion service, in which GAM both chooses the video ads and stitches them into the stream."},
  {t:'Direct campaign',a:['direct campaign','guaranteed','sponsorship'],d:'Advertising the publisher sold itself with a promised delivery. In GAM these are sponsorship and standard line items, the highest priorities.'},
  {t:'DSP',a:['DSP'],d:'Demand-side platform: the tool advertisers and agencies use to buy impressions from exchanges and SSPs.'},
  {t:'DV360',a:['DV360'],d:"Display & Video 360, Google's DSP."},
  {t:'Dynamic allocation',a:['dynamic allocation'],d:"GAM's mechanism that lets AdX and Open Bidding compete with the publisher's line items on price for each impression."},
  {t:'Exchange',a:['exchange'],d:'A marketplace where buyers bid on impressions in real time. Often used interchangeably with SSP.'},
  {t:'FAST',a:['FAST'],d:'Free ad-supported streaming TV: linear channels streamed online and paid for by ads.'},
  {t:'Friendly iframe',a:['friendly iframe'],d:"An iframe that shares the page's origin, so code inside it can read and change the page."},
  {t:'GAM (Google Ad Manager)',a:['GAM','Google Ad Manager'],d:"Google's ad server for publishers. Ad Manager 360 is its paid enterprise tier."},
  {t:'GMA SDK (Google Mobile Ads SDK)',a:['GMA SDK','Google Mobile Ads'],d:'Google’s app SDK that requests ads from GAM or AdMob and renders them.'},
  {t:'GPT (Google Publisher Tag)',a:['GPT','Google Publisher Tag','googletag'],d:'Google’s JavaScript library on the page that defines ad slots, sends ad requests to GAM and puts the returned creatives into the slots.'},
  {t:'hb_* keys',r:/(^|[^A-Za-z0-9_])(hb_[A-Za-z_*]+)/,d:'The key-values Prebid sets on the ad request: hb_pb (price bucket), hb_adid (bid ID used to render), hb_bidder, hb_size, hb_format, hb_source, and hb_cache_id / hb_uuid when the bid is stored in Prebid Cache.'},
  {t:'Header bidding',a:['header bidding'],d:"Collecting bids from outside buyers before the ad server is called, so those bids compete with the ad server's own demand. Named after the page's <head>, where the code first ran."},
  {t:'Header bidding trafficking',a:['header bidding trafficking'],d:'An optional GAM 360 feature that brings Prebid bids into GAM through yield groups, at their true price, instead of price-bucket line items. It can run alongside the classic line-item setup.'},
  {t:'HLS / DASH',a:['HLS','DASH','manifest'],d:'The two main streaming video formats. A manifest file lists the video segments; stitchers insert ads by rewriting it.'},
  {t:'House ad',a:['house'],d:"The publisher's own filler ads (for example self-promotion), served at the lowest priority when nothing else is eligible."},
  {t:'IAB Tech Lab',a:['IAB'],d:'The industry body that publishes ad tech standards such as OpenRTB, VAST, MRAID and SafeFrame.'},
  {t:'IFA',a:['IFA'],d:"A device's advertising identifier (IDFA on iOS, AAID on Android, platform IDs on TVs)."},
  {t:'IMA SDK',a:['IMA'],d:"Google's Interactive Media Ads SDK: a library for video players that requests VAST from GAM and plays the ads."},
  {t:'Impression',a:['impression'],d:'One ad shown once. Ads are priced and counted per impression.'},
  {t:'In-app bidding',a:['in-app bidding','bidding network'],d:'Mediation in which ad networks bid in real time for each ad request, instead of being called in a fixed order.'},
  {t:'Instream',a:['instream','preroll','midroll'],d:'Video ads played inside a content player before (preroll), during (midroll) or after the video.'},

(function compileGloss(){
  const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  GLOSS.forEach(g=>{
    if(g.r){ g.re=new RegExp(g.r.source,'g'); return; }
    const parts=g.a.map(a=>{
      const ci=!/[A-Z]/.test(a);
      return {src:escRe(a)+'(?:e?s)?',ci};
    });
    // case-sensitive and case-insensitive aliases in separate expressions
    const cs=parts.filter(p=>!p.ci).map(p=>p.src), ci=parts.filter(p=>p.ci).map(p=>p.src);
    g.res=[];
    if(cs.length) g.res.push(new RegExp('(^|[^A-Za-z0-9_])('+cs.join('|')+')(?![A-Za-z0-9_])','g'));
    if(ci.length) g.res.push(new RegExp('(^|[^A-Za-z0-9_])('+ci.join('|')+')(?![A-Za-z0-9_])','gi'));
    g.re=null;
  });
})();
function glossRegexes(g){ return g.re?[g.re]:g.res; }

  title:'Prebid.js + Google Ad Manager', parent:'web-hb', h:640,
  summary:`<p>Prebid.js, the open-source header bidding library, runs an auction among SSPs in the browser and hands the top bid to GAM as key-values. A Prebid line item priced at that bid's bucket enters GAM's normal selection and competes against direct campaigns and Google's demand. If it wins, its creative asks Prebid.js for the bid it's holding in memory and draws it.</p><p>This is the classic setup and works on every GAM tier. Ad Manager 360 also offers <a href="#hbt">header bidding trafficking</a>, which replaces the line items with yield groups; the two can run side by side.</p><p>Click <em>Prebid wins</em> to see how that creative renders.</p>`,
  src:[S.pbSbs,S.pbKv,S.pbSendAll,S.pbCreatives],
  groups:[{x:60,y:310,w:560,h:208,label:'Google Ad Manager auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'Asks bidders in parallel',k:'prebid',
      info:`<p>Prebid.js sends bid requests to each configured bidder adapter (one per SSP) in parallel, waits up to the timeout, then picks the highest bid per ad unit. Late bids are dropped for this auction.</p>`},
    {id:'a',x:90,y:120,w:140,h:44,t:'SSP A: $1.80',k:'prebid',info:`<p>A losing bid. It never renders. With send-all-bids on (Prebid's default) its keys still go to GAM with a bidder suffix (<code>hb_pb_bidderA</code>), which publishers use for reporting or per-bidder line items.</p>`},
    {id:'b',x:270,y:120,w:140,h:44,t:'SSP B: $2.50',k:'prebid',info:`<p>The top bid. Prebid keeps its ad markup in memory and assigns it an ID, which becomes <code>hb_adid</code>. Its price, rounded down to the configured price granularity, becomes <code>hb_pb</code>.</p>`},
    {id:'c',x:450,y:120,w:140,h:44,t:'SSP C: $0.90',k:'prebid',info:`<p>A losing bid. It is never rendered.</p>`},
    {id:'kv',x:170,y:210,w:340,h:56,t:'GPT ad request to GAM',s:'hb_pb=2.50 · hb_bidder=B',k:'prebid',
      info:`<p><code>pbjs.setTargetingForGPTAsync()</code> sets key-values on the GPT slots. The main ones: <code>hb_pb</code> (price bucket, used for line item targeting), <code>hb_adid</code> (bid ID, used for rendering), <code>hb_bidder</code> (reporting), <code>hb_format</code> and <code>hb_size</code>.</p><p>With send-all-bids (the default), each bidder's own suffixed keys are sent too, alongside the winner's unsuffixed ones.</p>`},

render:{
  title:'How a winning Prebid bid renders', parent:'prebid-gam', h:400,
  summary:`<p>When a Prebid line item wins, the ad server serves a creative that holds no ad, only a pointer to one. There are three ways that creative reaches the real ad, depending on whether Prebid.js is on the page and whether the creative's iframe is same-origin with the page.</p><p>The paths also differ in what the ad's own code can reach once it runs: in the direct-call path it runs in the page's own origin; in the other two it stays inside a cross-origin frame.</p>`,
  src:[S.pbPuc,S.pbRenderAd,S.gSafeFrame],
  nodes:[
    {id:'won',x:200,y:20,w:280,h:56,t:'Prebid line item wins',s:'Ad server serves its creative',k:'prebid',
      info:`<p>The Prebid line item won in the ad server, which now serves that line item's creative into the slot. The creative carries pointers, not an ad: <code>hb_adid</code> for Prebid.js, or the <code>hb_cache_*</code> keys for Prebid Cache.</p><p>Video works differently: instream plays through a VAST redirect and outstream through a renderer on the page. Both have their own maps.</p>`},
    {id:'q1',x:200,y:116,w:280,h:56,t:'Is Prebid.js on the page?',s:'Web page vs AMP or app',k:'step',
      info:`<p>On a normal web page, Prebid.js ran the auction and still holds the winning bid in memory. On AMP pages and in apps, the auction ran in Prebid Server and nothing on the page holds the bid, so the creative has to fetch it from Prebid Cache.</p>`},
    {id:'q2',x:60,y:212,w:300,h:56,t:'Can the creative reach it?',s:'Friendly iframe vs SafeFrame',k:'step',
      info:`<p>That depends on how the ad server delivers the creative. A friendly iframe (SafeFrame turned off on the creative) is same-origin with the page, so the creative can call Prebid.js directly. A SafeFrame is served from another domain, so the browser blocks direct access and the creative has to send a message instead.</p>`},
    {id:'lg',x:40,y:308,w:190,h:64,t:'Direct call',s:'Friendly iframe (legacy)',k:'prebid',exec:true,go:'render-legacy'},
    {id:'pm',x:250,y:308,w:190,h:64,t:'postMessage',s:'SafeFrame (current)',k:'prebid',exec:true,go:'puc'},
    {id:'ch',x:460,y:308,w:190,h:64,t:'Fetch from cache',s:'AMP and apps',k:'prebid',exec:true,go:'render-cache'}
  ],
  edges:[

},

puc:{
  title:'Render via postMessage (SafeFrame)', parent:'render', kind:'seq', h:470,
  summary:`<p>The current and recommended path. The GAM creative is the Prebid Universal Creative (PUC) and contains no ad, only the bid ID. It's served into a cross-origin SafeFrame, so it can't reach into the page. Instead it uses <code>postMessage</code> to ask Prebid.js for the bid. Prebid.js replies with the ad markup, and the creative writes it into its own frame.</p><p>The ad's code runs inside that cross-origin frame and can't touch the publisher page directly.</p>`,
  src:[S.pbPuc,S.pbCreatives,S.gSafeFrame],
  lanes:[
    {x:130,t:'GAM',k:'gam',
      info:`<p>GAM picked the Prebid line item and serves its creative, the Prebid Universal Creative, with the <code>%%PATTERN:hb_adid%%</code> macro replaced by the real bid ID. With "Serve into a SafeFrame" on, GPT puts it in a cross-origin iframe.</p>`},
    {x:340,t:'Creative iframe',k:'prebid',
      info:`<p>The Prebid Universal Creative script runs here. It holds no ad of its own. Because a SafeFrame is cross-origin, it can't call <code>window.parent.pbjs</code>, so it sends a <code>postMessage</code> to the page and waits for the reply.</p>`},
    {x:550,t:'Prebid.js on page',k:'prebid',
      info:`<p>Prebid.js listens for render-request messages from creative frames, looks up the requested bid, and replies to the frame that asked with the ad markup (or ad URL) and its size.</p>`}
  ],
  msgs:[
    {y:110,from:130,to:340,label:'Serves creative, hb_adid filled'},
    {y:180,from:340,to:550,label:'postMessage: render 3f9a1c'},
    {y:320,from:550,to:340,label:'postMessage: ad markup'}
  ],
  nodes:[
    {id:'lk',x:470,y:210,w:160,h:56,t:'Looks up bid',s:'Marks won, bidWon',k:'prebid',
      info:`<p>Prebid.js finds the bid by its ID among bids from the auction, warns if it has already rendered, marks it won, and fires the <code>bidWon</code> event (used by analytics) and the bidder's win notification if it has one.</p>`},
    {id:'wr',x:260,y:360,w:160,h:56,t:'Writes the ad',s:'Inside the SafeFrame',k:'prebid',exec:true,
      info:`<p>The creative writes the markup (or loads the ad URL) inside its frame, and the SSP's impression trackers fire. The ad's scripts run in the SafeFrame's own origin: they can't read or change the publisher page. Prebid resizes the frame to the ad's size from the page side.</p>`}
  ],
  code:[{label:'GAM creative (PUC), served into a SafeFrame',body:SNIP.puc}]
},

'render-legacy':{
  title:'Direct call from a friendly iframe (legacy)', parent:'render', kind:'seq', h:470,
  summary:`<p>The original Prebid creative, from before the universal creative. The line item's creative is served with SafeFrame off, so it lands in a friendly iframe that shares the page's origin. The creative walks up <code>window.parent</code> until it finds <code>pbjs</code> and calls <code>pbjs.renderAd()</code> directly, and Prebid.js writes the ad straight into the iframe's document.</p><p>No messaging and no isolation: the ad's code runs in the publisher's origin. You'll still find this creative on older GAM setups.</p>`,
  src:[S.pbRenderAd,S.gSafeFrame],
  lanes:[
    {x:130,t:'GAM',k:'gam',
      info:`<p>GAM serves the line item's creative with "Serve into a SafeFrame" off, so GPT renders it into a friendly iframe: an iframe the page writes into itself, with the same origin as the page.</p>`},
    {x:340,t:'Friendly iframe',k:'prebid',
      info:`<p>Because the frame is same-origin, its script can walk up <code>window.parent</code> until it finds <code>pbjs</code> and call it directly. The legacy creative always does this. Older versions of the Prebid Universal Creative also took this path when they could reach Prebid.js.</p>`},
    {x:550,t:'Prebid.js on page',k:'prebid',
      info:`<p><code>pbjs.renderAd(doc, adId)</code> receives the iframe's own <code>document</code> object, looks up the bid, and writes into that document from the page's side.</p>`}
  ],
  msgs:[
    {y:110,from:130,to:340,label:'Serves creative, hb_adid filled'},
    {y:180,from:340,to:550,label:'parent.pbjs.renderAd(document, id)'},
    {y:320,from:550,to:340,label:'Writes markup into the iframe'}
  ],
  nodes:[
    {id:'lk',x:470,y:210,w:160,h:56,t:'Looks up bid',s:'Marks won, bidWon',k:'prebid',
      info:`<p>The same bookkeeping as the postMessage path: find the bid by its ID, mark it won, fire <code>bidWon</code> and the bidder's win notification.</p>`},
    {id:'wr',x:260,y:360,w:160,h:56,t:'Ad runs same-origin',s:'Can reach the page',k:'prebid',exec:true,
      info:`<p>Prebid.js writes the ad markup straight into the iframe's document (or, for a URL-based bid, inserts an iframe pointing at it). The friendly iframe shares the publisher's origin, so the ad's scripts can read and change <code>window.top</code>: the page's DOM, its non-HttpOnly cookies, other ad slots, and top-level navigation.</p>`}
  ],
  code:[{label:'Legacy GAM creative (SafeFrame off)',body:SNIP.legacy}]
},

'render-cache':{
  title:'Fetch from Prebid Cache (AMP, apps)', parent:'render', kind:'seq', h:470,
  summary:`<p>When the auction ran in Prebid Server (AMP pages, the Prebid SDK in apps), nothing on the page holds the winning bid. The Prebid Universal Creative reads the cache location from the <code>hb_cache_*</code> keys, downloads the ad markup from Prebid Cache, and writes it into its own frame.</p><p>Instream video also uses Prebid Cache, but through a VAST redirect in the player rather than this creative.</p>`,
  src:[S.pbPuc,S.pbAmp,S.pbmGam],
  lanes:[
    {x:130,t:'Ad server',k:'gam',
      info:`<p>GAM, called from an AMP page or through the Google Mobile Ads SDK, picked the Prebid line item. It serves the universal creative with <code>hb_cache_host</code>, <code>hb_cache_path</code> and <code>hb_cache_id</code> filled in (or the full targeting map).</p>`},
    {x:340,t:'Creative frame',k:'prebid',
      info:`<p>The universal creative runs in AMP's cross-origin iframe or in the app's web view. There's no Prebid.js to ask, so it builds the cache URL from the keys instead.</p>`},
    {x:550,t:'Prebid Cache',k:'prebid',
      info:`<p>Prebid Server stored the winning bid's markup here during the auction, under the ID that became <code>hb_cache_id</code>. Entries expire after a set time, so a late render can come back empty.</p>`}
  ],
  msgs:[
    {y:110,from:130,to:340,label:'Serves creative, cache keys filled'},
    {y:180,from:340,to:550,label:'GET cache?uuid=hb_cache_id'},
    {y:320,from:550,to:340,label:'Stored ad markup'}
  ],
  nodes:[
    {id:'lk',x:470,y:210,w:160,h:56,t:'Finds the entry',s:'Saved at auction time',k:'prebid',
      info:`<p>Prebid Cache looks up the ID and returns the stored markup. Nothing is marked won and no <code>bidWon</code> fires in a browser; win counting relies on the tracking URLs in the markup and on Prebid Server's own events.</p>`},
    {id:'wr',x:260,y:360,w:160,h:56,t:'Writes the ad',s:'AMP frame or web view',k:'prebid',exec:true,
      info:`<p>The creative writes the markup into its own frame: AMP's cross-origin iframe, or the GMA SDK's web view in an app. No page script is involved; the ad's own scripts run inside that frame.</p>`}
  ],
  code:[{label:'GAM creative: PUC reading from Prebid Cache',body:SNIP.pucCache}]
},

amazon:{
  title:'Amazon TAM/UAM + GAM', parent:'web-hb',
  summary:`<p>Amazon's header bidding service: the page makes one call to Amazon through its library, <code>apstag</code>, and Amazon runs the auction on its own servers between Amazon's demand and the SSPs the publisher enabled.</p><p>TAM and UAM work the same way on the page; they differ in contracting. With TAM, large publishers contract with each SSP themselves: Amazon pays for Amazon demand and each SSP pays separately, with no Amazon fee. With UAM, Amazon manages the SSPs, pays the publisher for everything and takes a fee (about 10%).</p><p>The price comes back as an opaque code rather than a dollar value, and Amazon supplies the mapping so line items can be built per code. After that the pattern matches Prebid: a line item enters GAM, and its creative asks <code>apstag</code> to render.</p>`,
  src:[S.aps,S.apsHome],
  ...singleFlow({cat:'amazon',
    t1:'Page calls fetchBids',s1:'apstag, one call to Amazon',i1:`<p><code>apstag.init()</code> then <code>apstag.fetchBids()</code> with the slots and a timeout. Unlike Prebid, there are no per-bidder adapters on the page: all bidding happens on Amazon's servers.</p>`,
    t2:'Amazon returns a bid',s2:'Price as an encoded bucket',i2:`<p>The bid price is encoded (for example <code>amznbid=1d4n7k</code>) so the price isn't exposed in the page. The mapping from codes to prices comes from Amazon's portal.</p>`,
    t3:'GPT ad request to GAM',s3:'amznbid, amzniid keys',i3:`<p><code>apstag.setDisplayBids()</code> sets <code>amznbid</code> (encoded price), <code>amzniid</code> (impression ID, used for rendering), <code>amznsz</code> (size) and <code>amznp</code> on the GPT slots.</p>`,
    t4:'Amazon line item',s4:'Targets amznbid code',i4:`<p>Price-priority line items, each targeting the <code>amznbid</code> codes that map to its price.</p>`,
    axS:'Must beat Amazon price',
    t5:'Amazon wins',s5:'apstag draws the ad',i5:`<p>The line item's creative calls <code>apstag.renderImp(document, amzniid)</code> on the parent page's <code>apstag</code>. As with Prebid, the creative is a pointer: <code>apstag</code> holds the ad and writes it into the frame. Amazon's SafeFrame-compatible creative loads its own helper script to do this across origins.</p>`}),
  code:[{label:'Page: Amazon bids into GAM',body:`apstag.init({ pubID: 'YOUR_PUB_ID', adServer: 'googletag' });

apstag.fetchBids({
  slots: [{ slotID: 'div-top', slotName: '/1234/homepage/top', sizes: [[300, 250]] }],
  timeout: 1000
}, function (bids) {
  googletag.cmd.push(function () {
    apstag.setDisplayBids();          // amznbid, amzniid ... on the GPT slots
    googletag.pubads().refresh();
  });
});`},{label:'Shape of the GAM creative (copy the exact one from Amazon\u2019s portal)',body:`<script>
  // Indicative only. apstag lives on the parent page, not in this iframe,
  // so the creative walks up to find it. Amazon also provides a
  // SafeFrame-compatible version that loads its own render helper.
  var w = window;
  for (var i = 0; i < 10; i++) {
    w = w.parent;
    if (w.apstag) {
      try { w.apstag.renderImp(document, '%%PATTERN:amzniid%%'); break; } catch (e) {}
    }
  }
<\/script>`}]
},

fastlane:{
  title:'Magnite (Rubicon) Fastlane + GAM', parent:'web-hb',
  summary:`<p>Fastlane was Rubicon Project's (now Magnite's) own header bidding tag, from before multi-bidder wrappers like Prebid took over: one SSP, many buyers behind it. It passes price tiers to GAM as key-values, and matching line items carry a creative that asks the Fastlane tag on the page to render.</p><p>It's legacy now: Magnite demand is usually reached through Prebid's <code>rubicon</code> adapter or Magnite Demand Manager. You may still find it on older sites.</p>`,
  src:[S.pbRubicon],
  ...singleFlow({cat:'magnite',
    t1:'Page loads rubicontag',s1:'Magnite Fastlane tag',i1:`<p>The Fastlane library defines slots matching the GPT slots and requests bids from Magnite.</p>`,
    t2:'Magnite returns bids',s2:'Mapped to price tiers',i2:`<p>Bids come back already rounded into tiers rather than exact prices.</p>`,
    t3:'GPT ad request to GAM',s3:'rpfl_* tier keys',i3:`<p>Keys are named per site or account (for example <code>rpfl_&lt;id&gt;</code>) with values combining a size ID and tier (for example <code>15_tier0250</code>). Check the exact naming in Magnite's documentation for the account.</p>`,
    t4:'Fastlane line item',s4:'Targets tier value',i4:`<p>One price-priority line item per tier, targeting the tier values.</p>`,
    axS:'Must beat the tier',
    t5:'Magnite wins',s5:'rubicontag renders ad',i5:`<p>The creative calls back into the Fastlane tag on the parent page to render the Magnite ad it's holding, the same pointer pattern as Prebid's legacy creative.</p>`})
},

  code:[{label:'Page: wait for both, then one GAM request',body:`var done = { prebid: false, aps: false };
function sendToGam() {
  if (!done.prebid || !done.aps) return;
  googletag.cmd.push(function () { googletag.pubads().refresh(); });
}

apstag.fetchBids({ slots: apsSlots, timeout: 1000 }, function () {
  googletag.cmd.push(function () {
    apstag.setDisplayBids();
    done.aps = true; sendToGam();
  });
});

pbjs.que.push(function () {
  pbjs.requestBids({
    timeout: 1000,
    bidsBackHandler: function () {
      googletag.cmd.push(function () {
        pbjs.setTargetingForGPTAsync();
        done.prebid = true; sendToGam();
      });
    }
  });
});
// Production code also adds a hard failsafe timer that calls refresh() anyway.`}]

pbs:{
  title:'Prebid Server + GAM', parent:'web-hb', h:570,
  summary:`<p>Prebid Server is the server version of Prebid. The GAM side is the same as client-side Prebid, but the calls to bidders happen on a server: Prebid.js makes one request to Prebid Server, which calls the SSPs server-to-server and returns their bids, ad markup included. The page then sends the usual keys to GAM, and the same Prebid Universal Creative renders the winner.</p><p>Fewer browser requests and lower page latency; the trade-off is weaker user matching, because SSPs can't read their own cookies unless a cookie sync ran earlier.</p>`,
  src:[S.pbsOverview,S.pbsModule,S.openrtb],
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'s2sConfig enabled',k:'prebid',
      info:`<p><code>s2sConfig</code> lists which bidders go to the server. Bidders not listed still run in the browser in the same auction, so many pages run a mix of both.</p>`},
    {id:'ps',x:200,y:116,w:280,h:56,t:'Prebid Server',s:'One call, fans out',k:'prebid',
      info:`<p>Receives one OpenRTB request from Prebid.js, calls the configured bidders server-side in parallel, applies its own timeout, and returns their bids. It can also store creatives in Prebid Cache when asked to.</p>`},
    {id:'a',x:90,y:212,w:140,h:44,t:'SSP A',k:'prebid',info:INFO.s2sBidder},

hbt:{
  title:'GAM header bidding trafficking', parent:'web-hb', h:540,
  summary:`<p>Google's built-in way to bring Prebid into GAM, available only in Ad Manager 360 and only for web inventory (Google lists banner; Prebid's docs also list in-renderer video; native isn't supported). Instead of hundreds of price-bucket line items, each Prebid bidder is set up as a header bidding partner in a yield group.</p><p>GPT collects the bids from Prebid.js on the page itself, so no key-value line items are needed, and the bids compete in GAM's unified auction at their actual price. When one wins, GAM asks Prebid.js to render it.</p><p>It's optional and can run alongside the <a href="#prebid-gam">classic line-item setup</a> in the same network, for example during a migration. Existing Prebid price-priority line items can stay; when a matching header bidding partner is competing, GAM leaves that line item out of the auction, and each impression is counted once.</p>`,
  src:[S.gHbt,S.gHbtFaq,S.pbHbt],
  groups:[{x:60,y:212,w:560,h:208,label:'GAM unified auction',k:'gam',
    info:`<p>The same auction as always, but header bidding bids now enter as yield group bids next to Open Bidding and AdX, instead of disguised as price-priority line items. Reporting shows them under the "Header bidding" demand channel, per bidder.</p><p>If classic Prebid line items are still set up, GAM drops a line item from this auction whenever a matching header bidding partner is competing, so the same bid doesn't compete twice.</p>`}],
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'Standard setup',k:'prebid',
      info:`<p>A standard Prebid.js setup with GPT. Google says no tagging changes are needed: Prebid.js runs its auction as usual.</p>`},
    {id:'kv',x:170,y:116,w:340,h:56,t:'GPT reads Prebid\u2019s bids',s:'Bidder and price, no line items',k:'prebid',
      info:`<p>Google says GPT collects what it needs from the Prebid wrapper directly, with no tagging changes, and that bids compete at their true value rather than through price-priority line items. That's why no price-bucket line items are needed.</p><p>Google doesn't document the exact mechanism. One of its requirements is a working <code>pbjs.getEvents()</code>, Prebid's log of auction events including every bid response, which suggests GPT reads the bids from there. That part is an inference, not something Google states.</p><p>Prebid still sets its usual <code>hb_*</code> key-values on the slots; any classic Prebid line items that remain in the network use them.</p>`},
    {id:'d',x:80,y:262,w:160,h:56,t:'Direct campaigns',s:'Guaranteed',k:'pub',info:INFO.direct},
    {id:'yg',x:260,y:262,w:160,h:56,t:'Header bidding',s:'Yield group per bidder',k:'prebid',
      info:`<p>Each Prebid bidder is set up as a header bidding partner in a yield group, the same interface used for Open Bidding. GAM matches the bid to the partner by bidder name.</p>`},
    {id:'ax',x:440,y:262,w:160,h:56,t:'Google demand',s:'AdX, Open Bidding',k:'google',info:INFO.adx},
    {id:'w',x:220,y:352,w:240,h:44,t:'Highest bid wins',k:'step',
      info:`<p>Guaranteed campaigns that need the impression still come first. Otherwise header bidding bids, AdX, Open Bidding and the remaining line items compete on price in one auction.</p>`},
    {id:'o',x:80,y:460,w:240,h:56,t:'Prebid bidder wins',s:'GAM asks Prebid to render',k:'prebid',exec:true,
      info:`<p>GAM doesn't have the ad markup; Prebid.js on the page does. GAM's response inlines the relevant part of the Prebid Universal Creative, which calls <code>pbjs.renderAd()</code> on the page, and the bidder's markup runs in the slot. The publisher traffics no creatives.</p>`},
    {id:'gw',x:360,y:460,w:240,h:56,t:'GAM demand wins',s:'Direct or AdX',k:'gam',exec:true,
      info:`<p>A direct campaign or Google's demand won. GAM serves that creative, and the Prebid bid is never rendered.</p>`}
  ],
  edges:[{a:'pj',b:'kv'},{p:[[340,172],[340,210]]},{p:[[160,318],[250,350]]},{p:[[340,318],[340,350]]},{p:[[520,318],[430,350]]},{p:[[290,396],[210,458]]},{p:[[390,396],[470,458]]}]
},

xandr:{
  title:'Prebid + Microsoft Monetize ad server', parent:'web-hb',
  summary:`<p>The same Prebid pattern with a different ad server: Microsoft Monetize (formerly Xandr, originally AppNexus). Its page tag is AST, the AppNexus Seller Tag (global object <code>apntag</code>), which plays the role GPT plays for GAM: it defines slots, sends the ad request and shows the result.</p><p>Prebid copies its keys onto the AST tags as keywords (Monetize's name for key-values). Monetize line items target <code>hb_pb</code>, and the creative is the same Prebid Universal Creative with Monetize's <code>#{...}</code> macros instead of GAM's <code>%%PATTERN:...%%</code>.</p><p>Microsoft has been retiring parts of the Xandr stack; check current product status for your account.</p>`,
  src:[S.ast,S.pbAst],
  ...singleFlow({cat:'xandr',server:'Monetize ad server auction',serverCat:'xandr',
    gInfo:`<p>Monetize's own decision: managed (direct) line items, Prebid line items and Monetize's own SSP demand compete in one auction, by priority and then price.</p>`,
    t1:'Prebid.js on the page',s1:'Asks bidders in parallel',c1:'prebid',i1:`<p>The same Prebid.js auction as with GAM. Only the ad server integration at the end differs.</p>`,
    t2:'Top bid picked',s2:'hb_pb=2.50, hb_adid',c2:'prebid',i2:`<p>Prebid picks the top bid per ad unit, keeps its markup in memory, and prepares the <code>hb_*</code> keys.</p>`,
    t3:'Monetize ad request',s3:'AST tag, keys as keywords',c3:'xandr',i3:`<p>AST (AppNexus Seller Tag) is Monetize's ad tag library on the page, the counterpart of GPT. <code>apntag.defineTag()</code> sets up each slot with a Monetize placement ID. After the Prebid auction, <code>pbjs.setTargetingForAst()</code> copies Prebid's keys onto those tags as keywords, and <code>apntag.loadTags()</code> sends one ad request to Monetize.</p>`,
    dT:'Managed campaigns',dS:'Direct deals',iD:`<p>Direct campaigns managed in Monetize at higher priority than the Prebid line items.</p>`,
    t4:'Prebid line item',s4:'Targets hb_pb=2.50',c4:'prebid',i4:`<p>Price-bucket line items in Monetize, targeting the <code>hb_pb</code> keyword, each carrying the Prebid Universal Creative.</p>`,
    axT:'Monetize demand',axS:'Must beat $2.50',axK:'xandr',iAx:`<p>Monetize's own SSP demand competes in the same auction.</p>`,
    iW:`<p>Monetize applies priority first, then price. The Prebid line item competes at the bucket price it was set up with.</p>`,
    t5:'Prebid wins',s5:'Universal creative renders',c5:'prebid',go5:'render',
    gwT:'Monetize wins',gwS:'Its own creative serves',iGw:`<p>The Prebid line item lost. Monetize serves its own direct or programmatic creative, and the Prebid bid is never rendered.</p>`}),
  code:[{label:'Page: AST slots, then Prebid keys into AST',body:`<script src="https://acdn.adnxs.com/ast/ast.js" async><\/script>
<script>
  var apntag = window.apntag || {};
  apntag.anq = apntag.anq || [];
  apntag.anq.push(function () {
    // one tag per slot: Monetize placement ID, sizes, and the div to fill
    apntag.defineTag({ tagId: 12345678, sizes: [[300, 250]], targetId: 'div-top' });
  });

  pbjs.que.push(function () {
    pbjs.requestBids({
      bidsBackHandler: function () {
        apntag.anq.push(function () {
          pbjs.setTargetingForAst();   // hb_* keys as AST keywords
          apntag.loadTags();           // one ad request to Monetize
        });
      }
    });
  });
<\/script>

<div id="div-top">
  <script>apntag.anq.push(function () { apntag.showTag('div-top'); });<\/script>
</div>`},{label:'Monetize creative (shape; see Prebid docs for the full snippet)',body:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/#{HB_FORMAT}.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = window.location.host;
  ucTagData.pubUrl = "\${REFERER_URL_ENC}";
  ucTagData.adId = "#{HB_ADID}";
  try { ucTag.renderAd(document, ucTagData); } catch (e) { console.log(e); }
<\/script>`}]
},

'open-bidding':{
  title:'Google Open Bidding', parent:'web-hb', h:540,
  summary:`<p>Open Bidding is Google's server-side alternative to header bidding. There is no wrapper on the page and no key-values: GPT sends a plain request, and GAM itself calls third-party exchanges server-to-server while it decides. Their bids compete in the unified auction next to AdX and the line items.</p><p>Google takes a fee on Open Bidding wins, and the publisher only sees what GAM reports.</p>`,
  src:[S.gOb,S.gDa],
  groups:[{x:40,y:212,w:600,h:208,label:'GAM unified auction',k:'gam',info:INFO.gamAuction}],
  nodes:[

      info:`<p>The page is identical to the no-header-bidding setup. Everything Open Bidding does happens inside Google's servers.</p>`},
    {id:'rq',x:200,y:116,w:280,h:56,t:'Ad request to GAM',s:'No bid keys attached',k:'page',
      info:`<p>A normal GPT request. The Open Bidding partners are configured in GAM as yield groups targeting ad units, sizes and formats.</p>`},
    {id:'d',x:60,y:260,w:128,h:56,t:'Direct',s:'Guaranteed',k:'pub',info:INFO.direct},
    {id:'rl',x:204,y:260,w:128,h:56,t:'Line items',s:'Remnant, house',k:'pub',

    {id:'ob',x:348,y:260,w:128,h:56,t:'Open Bidding',s:'Other exchanges',k:'google',
      info:`<p>GAM sends a bid request to each exchange in the matching yield group (for example Index Exchange, PubMatic, Magnite) server-to-server, with a short timeout. The exchanges return prices and creatives to Google, not to the page.</p>`},
    {id:'ax',x:492,y:260,w:128,h:56,t:'AdX',s:'Google buyers',k:'google',info:INFO.adx},
    {id:'w',x:220,y:352,w:240,h:44,t:'Highest eligible wins',k:'step',info:INFO.wins},
    {id:'o1',x:80,y:460,w:240,h:56,t:'Open Bidding wins',s:'Exchange creative serves',k:'google',exec:true,
      info:`<p>GAM serves the winning exchange's creative directly in its response, like an AdX ad. The buyer's tag, and whatever it loads, runs in the slot's iframe.</p>`},
    {id:'o2',x:360,y:460,w:240,h:56,t:'Other demand wins',s:'Direct, line item or AdX',k:'gam',exec:true,

adsense:{
  title:'AdSense only, no ad server', parent:'overview', h:530,
  summary:`<p>The simplest web setup, common on small sites: the publisher pastes Google's AdSense tag and Google does everything else. There's no ad server, no line items and no header bidding; Google runs the auction among its buyers and pays the publisher a share.</p><p>A publisher that wants direct campaigns or header bidding moves to an ad server such as GAM, where Google's demand keeps competing through AdX.</p>`,
  src:[S.adsHow,S.adsUnit,S.adsAuto],
  groups:[{x:40,y:212,w:600,h:200,label:"Google's auction",k:'frame',
    info:`<p>Google chooses the ad for each slot among the buyers that bid through its platform. The publisher controls formats and placements, not the auction.</p>`}],
  nodes:[
    {id:'pg',x:200,y:20,w:280,h:56,t:'Page loads adsbygoogle.js',s:'Ad units or Auto ads',k:'page',

    {id:'ga',x:60,y:258,w:180,h:56,t:'Google Ads',s:'Advertisers',k:'google',

amp:{
  title:'AMP pages: Prebid Server + GAM', parent:'overview',
  summary:`<p>AMP (Accelerated Mobile Pages) is Google's restricted HTML format for fast mobile pages; it's less common since Google stopped requiring it for Top Stories in 2021. AMP pages can't run their own JavaScript, so Prebid.js isn't available. Instead, the <code>amp-ad</code> component uses Real Time Config (RTC) to call Prebid Server before the GAM request. Prebid Server runs the auction, stores the bids in Prebid Cache, and returns key-values that AMP adds to the GAM request.</p><p>If the Prebid line item wins, the Prebid Universal Creative fetches the ad from Prebid Cache, since there's no Prebid.js on the page to ask.</p>`,
  src:[S.pbAmp,S.pbsAmp,S.pbCreatives],
  ...singleFlow({cat:'prebid',
    t1:'amp-ad with rtc-config',s1:'No page JavaScript allowed',c1:'page',i1:`<p>AMP doesn't allow custom JavaScript, so there's no Prebid.js. The <code>amp-ad</code> tag declares an <code>rtc-config</code> (Real Time Config) pointing at Prebid Server, directly or via a vendor shortcut, and the AMP runtime calls it before requesting the ad.</p>`,
    t2:'Prebid Server auction',s2:'Stored request, bids cached',i2:`<p>Prebid Server's <code>/openrtb2/amp</code> endpoint loads the stored request named by <code>tag_id</code> (which bidders, with which parameters), runs the auction, stores the bids in Prebid Cache, and returns only key-values.</p>`,
    t3:'amp-ad request to GAM',s3:'hb_pb, hb_cache_id added',i3:`<p>AMP merges the returned key-values into the GAM ad request, the same way GPT would on a normal page. The AMP runtime waits at most the RTC timeout, then sends the request with or without bids.</p>`,
    t4:'Prebid line item',s4:'Targets hb_pb',i4:`<p>Usually the same price-bucket line items as on the web, as long as their creative can fetch from Prebid Cache (the universal creative handles both).</p>`,
    axS:'Must beat Prebid price',
    t5:'Prebid wins',s5:'Fetched from Prebid Cache',go5:'render-cache'}),
  code:[{label:'amp-ad calling Prebid Server via RTC',body:`<amp-ad width="300" height="250"
  type="doubleclick"
  data-slot="/1234/amp/top"
  rtc-config='{
    "urls": ["https://prebid-server.example.com/openrtb2/amp?tag_id=amp-top-300x250&w=ATTR(width)&h=ATTR(height)&slot=ATTR(data-slot)&targeting=TGT&curl=CANONICAL_URL&timeout=TIMEOUT&adc=ADCID&purl=HREF&gdpr_consent=CONSENT_STRING"],
    "timeoutMillis": 1000
  }'>
</amp-ad>`},{label:'GAM creative: PUC reading from Prebid Cache',body:SNIP.pucCache}]
},

native:{
  title:'Native ads: Prebid + GAM', parent:'overview',
  summary:`<p>A native ad arrives as separate pieces (headline, image, sponsor name, click URL, trackers) and is laid out to match the surrounding content, instead of arriving as finished HTML. Prebid collects native bids as OpenRTB native assets; when the Prebid line item wins, a template is filled with the winning assets.</p><p>The template can live in the GAM creative, in the Prebid ad unit (Prebid's recommended option) or in a custom renderer script. In apps, the Prebid SDK hands the assets to the app, whose own code lays them out. GAM's header bidding trafficking doesn't support native.</p>`,
  src:[S.pbNative,S.pbNativeGam,S.gNative],
  ...singleFlow({cat:'prebid',
    t1:'Page has a native slot',s1:'Styled like the content',c1:'page',i1:`<p>A GPT slot in a feed or article, usually fluid-sized so the ad can take the width of the surrounding content.</p>`,
    t2:'Prebid native auction',s2:'Bidders return assets',i2:`<p>The ad unit declares <code>mediaTypes.native.ortb.assets</code> in the OpenRTB Native format: which title, image and data fields are required. Bidders return the asset values plus impression and click tracking URLs, not HTML.</p>`,
    t3:'GPT ad request to GAM',s3:'hb_pb, hb_format=native, hb_adid',i3:`<p>The usual <code>hb_*</code> keys with <code>hb_format=native</code>. <code>hb_adid</code> is what the creative later uses to ask Prebid.js for the assets.</p>`,
    t4:'Prebid line item',s4:'Native creative',i4:`<p>A price-priority line item whose creative is a GAM native creative (a native style) that loads the Prebid Universal Creative.</p>`,
    axS:'AdX native demand',
    t5:'Prebid wins',s5:'Template filled with assets',i5:`<p>The universal creative sends a <code>postMessage</code> to Prebid.js with <code>hb_adid</code> and gets the bidder's native assets back. It fills the template's macros (<code>##hb_native_asset_id_1##</code> and so on), writes the HTML into its frame, and fires the impression trackers. Elements marked with the <code>pb-click</code> class fire the click trackers.</p>`}),
  code:[{label:'Native ad unit with a Prebid-side template',body:`var nativeAdUnit = {
  code: 'div-native',
  mediaTypes: {
    native: {
      adTemplate: '<a class="pb-click" href="##hb_native_linkurl##">'
        + '<img src="##hb_native_asset_id_1##">'
        + '<h3>##hb_native_asset_id_2##</h3></a>'
        + '<p>Sponsored by ##hb_native_asset_id_3##</p>',
      ortb: {
        assets: [
          { id: 1, required: 1, img: { type: 3, w: 300, h: 157 } },  // main image
          { id: 2, required: 1, title: { len: 80 } },                 // headline
          { id: 3, required: 1, data: { type: 1 } }                   // sponsor name
        ]
      }
    }
  },
  bids: [{ bidder: 'bidderA', params: { placementId: 123 } }]
};`}]
},

app:{
  title:'Mobile app: Prebid SDK + GAM', parent:'overview', h:640,
  summary:`<p>An app that uses GAM as its ad server, with bidding SDKs in front of it. The Prebid SDK asks Prebid Server for bids and Amazon's APS SDK asks Amazon; both add keywords (key-values) to the ad request that the Google Mobile Ads (GMA) SDK sends to GAM. GAM decides the same way as on the web.</p><p>A Prebid win renders in one of two modes. <em>Bidding-only</em>: GAM serves the Prebid Universal Creative, which fetches the ad from Prebid Cache. <em>Prebid-rendered</em>: GAM serves only a signal, and the Prebid SDK renders the ad itself (with Open Measurement and SKAdNetwork support).</p><p>Apps that use a mediation platform (AppLovin MAX, AdMob, LevelPlay) instead of GAM follow the mediation map.</p>`,
  src:[S.pbm,S.pbmGam,S.pbmRender,S.apsHome,S.gMediation,S.mraid],
  groups:[{x:40,y:308,w:600,h:208,label:'Google Ad Manager auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'ap',x:200,y:20,w:280,h:56,t:'App requests an ad',s:'Bidding SDKs go first',k:'app',
      info:`<p>Before loading the GAM ad, the app asks its bidding SDKs for bids. With Prebid, it calls the ad unit's <code>fetchDemand</code> with the GAM ad request object, and loads the GAM ad in the callback.</p>`},
    {id:'ps',x:60,y:116,w:260,h:56,t:'Prebid SDK + Prebid Server',s:'Bids cached, keywords back',k:'prebid',
      info:`<p>The Prebid SDK sends one OpenRTB request, identified by a stored-request config ID, to Prebid Server. Prebid Server calls the SSPs, stores the winning creatives in Prebid Cache, and returns keywords to the app.</p>`},
    {id:'am',x:360,y:116,w:260,h:56,t:'Amazon APS SDK',s:'Amazon bids, keywords back',k:'amazon',
      info:`<p>Amazon's in-app SDK requests Amazon demand for the slot and returns its result as keywords for the GAM request (for example <code>amznslots</code>, which encodes the price), the in-app counterpart of <code>apstag</code>.</p>`},
    {id:'kv',x:170,y:212,w:340,h:56,t:'GMA SDK request to GAM',s:'Prebid and Amazon keywords',k:'app',
      info:`<p>The SDKs add their keys to the GAM request as custom targeting: <code>hb_pb</code>, <code>hb_bidder</code>, <code>hb_cache_id</code> and related keys from Prebid, and Amazon's keys. The Google Mobile Ads SDK then calls GAM.</p>`},
    {id:'d',x:60,y:356,w:128,h:56,t:'Direct',s:'Guaranteed',k:'pub',info:INFO.direct},
    {id:'pl',x:204,y:356,w:128,h:56,t:'Prebid line item',s:'Targets hb_pb',k:'prebid',
      info:`<p>Price-priority line items per bucket, as on the web. The creative depends on the mode: the universal creative in cache mode for bidding-only, or Prebid's signal creative for Prebid-rendered.</p>`},

outstream:{
  title:'Outstream video: Prebid + GAM', parent:'overview',
  summary:`<p>Outstream video plays in a regular display slot (in an article or feed) with no content player on the page; Google now calls it in-renderer video. GAM treats it as a display impression. The bid carries a <em>renderer</em>: a script that builds a player and plays the VAST.</p><p>The key difference from banner: when Prebid renders the win, the renderer runs on the publisher page itself, not inside the creative iframe.</p>`,
  src:[S.pbOutstream,S.pbCreatives],
  ...singleFlow({cat:'prebid',

    t5:'Prebid wins',s5:'Renderer plays the VAST',i5:`<p>The universal creative asks Prebid.js to render <code>hb_adid</code>. Because the bid has a renderer, Prebid.js loads the renderer script and runs it on the publisher page, and the renderer builds a player in the slot's div and plays the VAST. The renderer, the media and any verification scripts all run here.</p>`}),

  summary:`<p>On connected TV (CTV) and free ad-supported TV channels (FAST), the player usually doesn't request ads at all. A server-side ad insertion (SSAI) service, the stitcher, sits between player and stream, calls the ad server at each break, and splices the ads into the video stream so they play like content.</p><p>Because everything happens server-to-server, the device's IP address, user agent and advertising ID must be forwarded, and no creative JavaScript can run.</p>`,

glossary:{
  title:'Glossary', parent:'overview', kind:'glossary',
  summary:`<p>Plain-language definitions of every term used on these maps, with links to the maps that use each one. Each map's side panel also lists the terms it uses, and underlined terms in the text show their definition on hover or tap.</p>`,
  src:[S.openrtb,S.vast,S.mraid,S.safeframe],
  nodes:[]
}
};

/* ---------- rendering ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current=null, selected=null;

function edgePath(e,nodes){
  let pts=e.p;
  if(!pts){
    const a=nodes.find(n=>n.id===e.a), b=nodes.find(n=>n.id===e.b);
    if(b.y>=a.y+a.h-1) pts=[[a.x+a.w/2+(e.ao||0),a.y+a.h],[b.x+b.w/2+(e.bo||0),b.y-2]];
    else if(b.x>a.x) pts=[[a.x+a.w,a.y+a.h/2],[b.x-2,b.y+b.h/2]];
    else pts=[[a.x,a.y+a.h/2],[b.x+b.w+2,b.y+b.h/2]];
  }
  return 'M'+pts.map(p=>p.join(' ')).join(' L');
}

function nodeSVG(n){
  const cx=n.x+n.w/2, cy=n.y+n.h/2, clk=!!(n.go||n.info);
  let s=`<g class="n k-${n.k}${clk?' clk':''}" data-id="${n.id}" ${clk?'tabindex="0" role="button"':''} aria-label="${esc(n.t)}${n.go?' (open map)':''}">`;
  if(n.exec) s+=`<rect class="x" x="${n.x-4}" y="${n.y-4}" width="${n.w+8}" height="${n.h+8}" rx="10"/>`;
  s+=`<rect class="b" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>`;
  if(n.s){
    s+=`<text class="tt" x="${cx}" y="${cy-10}" text-anchor="middle" dominant-baseline="central">${esc(n.t)}</text>`;
    s+=`<text class="tu" x="${cx}" y="${cy+10}" text-anchor="middle" dominant-baseline="central">${esc(n.s)}</text>`;
  } else s+=`<text class="tt" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central">${esc(n.t)}</text>`;
  if(n.go){
    const bx=n.x+n.w-11, by=n.y+11;
    s+=`<g class="dr"><circle cx="${bx}" cy="${by}" r="7"/><path d="M${bx-2} ${by-3} L${bx+1.5} ${by} L${bx-2} ${by+3}"/></g>`;
  }
  return s+'</g>';
}

/* all prose and labels of one map, as plain text */
function mapText(d){
  return [d.summary, ...items(d).flatMap(n=>[n.t,n.s,n.info]), ...(d.msgs||[]).map(m=>m.label), ...(d.edges||[]).map(e=>e.l), ...(d.code||[]).map(c=>c.label)]
    .filter(Boolean).map(x=>String(x).replace(/<[^>]+>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')).join('\n');
}
function termsIn(text){
  return GLOSS.filter(g=>glossRegexes(g).some(re=>{ re.lastIndex=0; return re.test(text); }));
}

function renderGlossary(){
  const used={};
  Object.keys(D).filter(k=>k!=='glossary').forEach(k=>termsIn(mapText(D[k])).forEach(g=>{ (used[g.t]=used[g.t]||[]).push(k); }));
  const list=[...GLOSS].sort((a,b)=>a.t.localeCompare(b.t,'en',{sensitivity:'base'}));
  return `<div class="gloss"><dl>`+list.map(g=>`<dt id="g-${slug(g.t)}">${esc(g.t)}</dt><dd>${esc(g.d)}`
    +((used[g.t]||[]).length?`<div class="on">On: ${used[g.t].map(k=>`<a href="#${k}">${esc(D[k].title)}</a>`).join(', ')}</div>`:'')+`</dd>`).join('')+`</dl></div>`;
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function render(id){
  const d=D[id]; if(!d){location.hash='#overview';return;}
  current=id; selected=null;
  const cv=document.getElementById('canvas');
  if(d.kind==='glossary'){
    cv.innerHTML=renderGlossary();
    renderCrumbs(); renderNav(); renderPanel();
    document.title=d.title+' | Ad serving setups';
    return;
  }
  let s=`<svg viewBox="0 0 680 ${d.h}" role="img" aria-labelledby="svgt"><title id="svgt">${esc(d.title)}</title>`;
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  (d.groups||[]).forEach((g,i)=>{
    const clk=!!g.info;
    s+=`<g class="g k-${g.k}${g.k==='frame'?' frame':''}${clk?' clk':''}" data-id="@g${i}" ${clk?`tabindex="0" role="button" aria-label="${esc(g.label)}"`:''}><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="14"/>`;
    s+= g.k==='frame' ? `<text class="gl" x="${g.x+16}" y="${g.y+22}">${esc(g.label)}</text>` : `<text class="gl" x="${g.x+g.w/2}" y="${g.y+24}" text-anchor="middle">${esc(g.label)}</text>`;
    s+='</g>';
  });
  if(d.kind==='seq'){
    d.lanes.forEach((l,i)=>{
      s+=`<line class="ll" x1="${l.x}" y1="64" x2="${l.x}" y2="${d.h-20}"/>`;
      s+=nodeSVG({id:'@l'+i,x:l.x-80,y:20,w:160,h:44,t:l.t,k:l.k,info:l.info});
    });
    d.msgs.forEach(m=>{
      const dir=m.to>m.from?1:-1;
      s+=`<text class="ml" x="${(m.from+m.to)/2}" y="${m.y-12}" text-anchor="middle">${esc(m.label)}</text>`;
      s+=`<line class="e" x1="${m.from+2*dir}" y1="${m.y}" x2="${m.to-4*dir}" y2="${m.y}" marker-end="url(#ar)"/>`;
    });
  }
  (d.edges||[]).forEach(e=>{ s+=`<path class="e" d="${edgePath(e,d.nodes)}" marker-end="url(#ar)"/>`; });
  (d.edges||[]).filter(e=>e.l).forEach(e=>{ s+=`<text class="el" x="${e.lx}" y="${e.ly}" text-anchor="middle" dominant-baseline="central">${esc(e.l)}</text>`; });
  d.nodes.forEach(n=>{ s+=nodeSVG(n); });
  s+='</svg>';
  cv.innerHTML=s;
  cv.querySelectorAll('.clk').forEach(el=>{
    const act=()=>activate(el.dataset.id);
    el.addEventListener('click',act);
    el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act();} });
  });
  renderCrumbs(); renderNav(); renderPanel();
  document.title=d.title+' | Ad serving setups';
}

/* nodes, sequence lanes (@l<i>) and groups (@g<i>) are all selectable */
function items(d){
  return [...(d.nodes||[]),
    ...(d.lanes||[]).map((l,i)=>({id:'@l'+i,t:l.t,k:l.k,info:l.info})),
    ...(d.groups||[]).map((g,i)=>({id:'@g'+i,t:g.label,k:g.k,info:g.info}))];
}

function activate(nid){
  const n=items(D[current]).find(x=>x.id===nid); if(!n) return;
  if(n.go){ location.hash='#'+n.go; return; }
  selected=nid;
  document.querySelectorAll('#canvas [data-id]').forEach(el=>el.classList.toggle('on',el.dataset.id===nid));
  renderPanel();
  // stacked layout: the panel sits below the diagram, so bring the explanation into view
  if(window.matchMedia('(max-width:1180px)').matches){
    const sel=document.querySelector('#panel .sel');
    if(sel) sel.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function chain(id){ const c=[]; while(id){ c.unshift(id); id=D[id].parent; } return c; }

function renderCrumbs(){
  const c=chain(current);
  document.getElementById('crumbs').innerHTML=c.map((id,i)=> i===c.length-1
    ? `<span class="cur">${esc(D[id].title)}</span>`
    : `<a href="#${id}">${esc(D[id].title)}</a><span aria-hidden="true">/</span>`).join(' ');
}

function renderNav(){
  const kids=p=>Object.keys(D).filter(k=>D[k].parent===p);
  const tree=p=>{ const k=kids(p); if(!k.length) return '';
    return '<ul>'+k.map(id=>`<li><a href="#${id}" class="${id===current?'on':''}">${esc(D[id].title)}</a>${tree(id)}</li>`).join('')+'</ul>'; };
  document.getElementById('nav').innerHTML=`<ul><li><a href="#overview" class="${current==='overview'?'on':''}">${esc(D.overview.title)}</a>${tree('overview')}</li></ul>`;
}

/* underline the first use of each glossary term in the panel prose; skip code, links and headings */
function markTerms(root){
  const done=new Set(), walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>
    t.parentElement.closest('code,pre,a,abbr,h2,h3,button,summary,.terms,.sources,.legend')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const texts=[]; while(walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(node=>{
    let t=node;
    for(;;){
      // earliest match of any term not yet marked (longest wins a tie)
      let best=null;
      for(const g of GLOSS){
        if(done.has(g.t)) continue;
        for(const re of glossRegexes(g)){
          re.lastIndex=0; const m=re.exec(t.nodeValue); if(!m) continue;
          const start=m.index+m[1].length;
          if(!best||start<best.start||(start===best.start&&m[2].length>best.word.length)) best={g,start,word:m[2]};
        }
      }
      if(!best) break;
      const after=t.splitText(best.start); const rest=after.splitText(best.word.length);
      const ab=document.createElement('abbr'); ab.className='gt'; ab.title=best.g.d; ab.dataset.g=slug(best.g.t); ab.textContent=best.word;
      after.replaceWith(ab); done.add(best.g.t); t=rest;
    }
  });
}

function renderPanel(){
  const d=D[current];
  let h=`<h2>${esc(d.title)}</h2><div class="sum">${d.summary||''}</div>`;
  if(d.kind!=='glossary'){
    const n=selected && items(d).find(x=>x.id===selected);
    if(n){
      h+=`<div class="sel"><h3>${esc(n.t)}</h3>${n.info||''}${n.exec?'<p class="exec">Third-party creative code executes here.</p>':''}</div>`;
    } else {
      h+=`<div class="sel empty">Click any box or group to see what happens there. Boxes with a round marker open a deeper map.</div>`;
    }
    const cats=[...new Set([...(d.nodes||[]).map(x=>x.k),...(d.lanes||[]).map(x=>x.k),...(d.groups||[]).map(x=>x.k)])].filter(k=>CATS[k]);
    const hasExec=(d.nodes||[]).some(x=>x.exec), hasGo=(d.nodes||[]).some(x=>x.go);
    h+=`<div class="legend">`+cats.map(k=>`<span><i class="k-${k}" style="background:var(--f);border-color:var(--s)"></i>${esc(CATS[k])}</span>`).join('')
      +(hasExec?`<span><i class="x"></i>Creative code runs here</span>`:'')
      +(hasGo?`<span><i class="d k-page" style="background:var(--ink2);border-color:var(--ink2)"></i>Opens a deeper map</span>`:'')+`</div>`;
  }
  (d.code||[]).forEach((c,i)=>{
    if(i===0) h+=`<h3>Code</h3>`;
    h+=`<div class="codeblock"><div class="bar"><span>${esc(c.label)}</span><button type="button" data-i="${i}">Copy</button></div><pre><code>${esc(c.body)}</code></pre></div>`;
  });
  if(d.kind!=='glossary'){
    const terms=termsIn(mapText(d)).sort((a,b)=>a.t.localeCompare(b.t,'en',{sensitivity:'base'}));
    if(terms.length) h+=`<details class="terms"><summary>Terms on this map (${terms.length})</summary><dl>`
      +terms.map(g=>`<dt id="t-${slug(g.t)}">${esc(g.t)}</dt><dd>${esc(g.d)}</dd>`).join('')+`</dl></details>`;
  }
  if((d.src||[]).length) h+=`<div class="sources"><h3>Sources</h3><ul>`+d.src.map(([l,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join('')+`</ul></div>`;
  const p=document.getElementById('panel'); p.innerHTML=h;
  markTerms(p);
  p.querySelectorAll('abbr.gt').forEach(ab=>ab.addEventListener('click',()=>{
    const det=p.querySelector('details.terms'), dt=p.querySelector('#t-'+ab.dataset.g);
    if(!det||!dt) return;
    det.open=true; dt.scrollIntoView({behavior:'smooth',block:'center'});
    dt.classList.add('flash'); setTimeout(()=>dt.classList.remove('flash'),1600);
  }));
  p.querySelectorAll('.codeblock button').forEach(b=>b.addEventListener('click',()=>{
    const body=d.code[+b.dataset.i].body;
    (navigator.clipboard?navigator.clipboard.writeText(body):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400);})
      .catch(()=>{b.textContent='Select and copy';});
  }));
}

window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'overview'));
render(location.hash.slice(1)||'overview');
</script>
