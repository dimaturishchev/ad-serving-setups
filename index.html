<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad decision maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#17202B;--ink2:#4A5563;--ink3:#7A8594;--line:#D5DBE2;--exec:#C0392B;--focus:#185FA5;
  --prebid-f:#E1F5EE;--prebid-s:#0F6E56;--prebid-t:#085041;--prebid-u:#0F6E56;
  --gam-f:#F4F3FE;--gam-s:#534AB7;--gam-t:#3C3489;--gam-u:#534AB7;
  --google-f:#F1EFE8;--google-s:#5F5E5A;--google-t:#2C2C2A;--google-u:#5F5E5A;
  --amazon-f:#FAEEDA;--amazon-s:#854F0B;--amazon-t:#633806;--amazon-u:#854F0B;
  --magnite-f:#FAECE7;--magnite-s:#993C1D;--magnite-t:#712B13;--magnite-u:#993C1D;
  --app-f:#E6F1FB;--app-s:#185FA5;--app-t:#0C447C;--app-u:#185FA5;
  --video-f:#FBEAF0;--video-s:#993556;--video-t:#72243E;--video-u:#993556;
  --net-f:#EEF4DD;--net-s:#5B7A1A;--net-t:#3D5410;--net-u:#5B7A1A;
  --page-f:#FFFFFF;--page-s:#7A8594;--page-t:#17202B;--page-u:#4A5563;
  --frame-f:transparent;--frame-s:#AAB3BF;--frame-t:#4A5563;--frame-u:#7A8594;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161C;--surface:#1A2029;--ink:#E7ECF2;--ink2:#A9B4C2;--ink3:#7D8896;--line:#2C3643;--exec:#F07167;--focus:#85B7EB;
  --prebid-f:#0B3D32;--prebid-s:#5DCAA5;--prebid-t:#E1F5EE;--prebid-u:#9FE1CB;
  --gam-f:#1E1B3A;--gam-s:#7F77DD;--gam-t:#CECBF6;--gam-u:#AFA9EC;
  --google-f:#2C2C2A;--google-s:#B4B2A9;--google-t:#F1EFE8;--google-u:#D3D1C7;
  --amazon-f:#4A2E08;--amazon-s:#EF9F27;--amazon-t:#FAEEDA;--amazon-u:#FAC775;
  --magnite-f:#4A1B0C;--magnite-s:#F0997B;--magnite-t:#FAECE7;--magnite-u:#F5C4B3;
  --app-f:#0C2E52;--app-s:#85B7EB;--app-t:#E6F1FB;--app-u:#B5D4F4;
  --video-f:#4B1528;--video-s:#ED93B1;--video-t:#FBEAF0;--video-u:#F4C0D1;
  --net-f:#26330C;--net-s:#A8CB5C;--net-t:#EEF4DD;--net-u:#C9E08F;
  --page-f:#1A2029;--page-s:#7D8896;--page-t:#E7ECF2;--page-u:#A9B4C2;
  --frame-s:#46505E;--frame-t:#A9B4C2;--frame-u:#7D8896;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-0.01em}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--ink3)}
.crumbs a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{color:var(--ink);border-color:var(--ink3)}
.crumbs span.cur{color:var(--ink)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;min-height:calc(100vh - 62px)}
.layout>*{min-width:0}
nav{border-right:1px solid var(--line);padding:18px 14px;font-size:14px}
nav ul{list-style:none;margin:0;padding:0 0 0 12px}
nav>ul{padding:0}
nav li{margin:2px 0}
nav a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink2);text-decoration:none}
nav a:hover{background:var(--line);color:var(--ink)}
nav a.on{background:var(--ink);color:var(--bg)}
main{padding:24px 28px;display:flex;justify-content:center;align-items:flex-start}
#canvas{width:100%;max-width:760px}
#canvas svg{width:100%;height:auto;display:block}
aside{border-left:1px solid var(--line);background:var(--surface);padding:24px 24px 40px;overflow-wrap:anywhere}
aside h2{font-size:20px;font-weight:500;margin:0 0 8px;letter-spacing:-0.01em}
aside h3{font-size:15px;font-weight:500;margin:22px 0 6px}
aside p{margin:0 0 10px;color:var(--ink2);max-width:62ch}
aside code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 4px;border-radius:4px;color:var(--ink)}
.sel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:16px 0;background:var(--bg)}
.sel h3{margin-top:0}
.sel .exec{color:var(--exec);font-size:13.5px;margin:6px 0 0}
.sel.empty{color:var(--ink3);font-size:14px}
.codeblock{margin:10px 0 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codeblock .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;color:var(--ink2);background:var(--bg);border-bottom:1px solid var(--line)}
.codeblock .bar span{padding-right:10px}
.codeblock button{white-space:nowrap;flex-shrink:0;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.codeblock button:hover{border-color:var(--ink3)}
.codeblock pre code{background:none;padding:0;font-size:inherit}
.codeblock pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--surface);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid}
.legend i.x{border:1.5px dashed var(--exec);background:transparent}
.legend i.d{border-radius:50%}
/* svg */
svg text{font-family:var(--sans)}
.n{cursor:default}
.n.clk{cursor:pointer}
.n rect.b{fill:var(--f);stroke:var(--s);stroke-width:0.8}
.n.clk:hover rect.b{stroke-width:1.6}
.n.on rect.b{stroke-width:2.2}
.n:focus{outline:none}
.n:focus-visible rect.b{stroke:var(--focus);stroke-width:2.4}
.n rect.x{fill:none;stroke:var(--exec);stroke-width:1.4;stroke-dasharray:5 3}
.tt{font-size:13.5px;font-weight:500;fill:var(--t)}
.tu{font-size:12px;fill:var(--u)}
.dr circle{fill:var(--s)}
.dr path{stroke:var(--f);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.g rect{fill:var(--f);stroke:var(--s);stroke-width:0.8}
.g.frame rect{stroke-dasharray:4 4}
.g.clk{cursor:pointer}
.g.clk:hover rect{stroke-width:1.6}
.g.on rect{stroke-width:2.2}
.g:focus{outline:none}
.g:focus-visible rect{stroke:var(--focus);stroke-width:2.4}
.gl{font-size:13.5px;font-weight:500;fill:var(--t)}
.e{stroke:var(--ink3);stroke-width:1.2;fill:none}
.ll{stroke:var(--ink3);stroke-width:0.8;stroke-dasharray:4 4}
.ml{font-size:12px;fill:var(--ink2)}
.k-prebid{--f:var(--prebid-f);--s:var(--prebid-s);--t:var(--prebid-t);--u:var(--prebid-u)}
.k-gam{--f:var(--gam-f);--s:var(--gam-s);--t:var(--gam-t);--u:var(--gam-u)}
.k-google{--f:var(--google-f);--s:var(--google-s);--t:var(--google-t);--u:var(--google-u)}
.k-amazon{--f:var(--amazon-f);--s:var(--amazon-s);--t:var(--amazon-t);--u:var(--amazon-u)}
.k-magnite{--f:var(--magnite-f);--s:var(--magnite-s);--t:var(--magnite-t);--u:var(--magnite-u)}
.k-app,.k-xandr{--f:var(--app-f);--s:var(--app-s);--t:var(--app-t);--u:var(--app-u)}
.k-video{--f:var(--video-f);--s:var(--video-s);--t:var(--video-t);--u:var(--video-u)}
.k-net{--f:var(--net-f);--s:var(--net-s);--t:var(--net-t);--u:var(--net-u)}
.k-page{--f:var(--page-f);--s:var(--page-s);--t:var(--page-t);--u:var(--page-u)}
.k-frame{--f:var(--frame-f);--s:var(--frame-s);--t:var(--frame-t);--u:var(--frame-u)}
@media (max-width:1180px){.layout{grid-template-columns:200px minmax(0,1fr)}aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px 12px}header{padding:14px 16px}}
</style>
</head>
<body>
<header>
  <h1>Ad decision maps</h1>
  <div class="crumbs" id="crumbs"></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="All maps"></nav>
  <main><div id="canvas"></div></main>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script>
/* ---------- category labels (legend) ---------- */
const CATS = {
  prebid:'Prebid', gam:'Ad server', google:"Google's own demand", amazon:'Amazon TAM/UAM',
  magnite:'Magnite Fastlane', app:'App SDK', xandr:'Microsoft / Xandr', video:'Video player / stitcher',
  net:'Ad network / SSP', page:'Page'
};

/* ---------- reusable snippets ---------- */
const SNIP = {
  pbjsGam:`pbjs.que.push(function () {
  pbjs.addAdUnits(adUnits);
  pbjs.requestBids({
    timeout: 1000,
    bidsBackHandler: function () {
      googletag.cmd.push(function () {
        pbjs.setTargetingForGPTAsync();   // hb_pb, hb_bidder, hb_adid ... on the GPT slots
        googletag.pubads().refresh();     // GAM request now carries the keys
      });
    }
  });
});
// GPT was set up with googletag.pubads().disableInitialLoad(),
// so no GAM request goes out until refresh() above.`,
  puc:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/%%PATTERN:hb_format%%.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = "";
  ucTagData.pubUrl = "%%PATTERN:url%%";
  ucTagData.targetingMap = %%PATTERN:TARGETINGMAP%%;
  ucTagData.hbPb = "%%PATTERN:hb_pb%%";
  ucTagData.hbFormat = "%%PATTERN:hb_format%%";
  ucTagData.adId = "%%PATTERN:hb_adid%%";
  try {
    ucTag.renderAd(document, ucTagData);
  } catch (e) {
    console.log(e);
  }
<\/script>`,
  pucCache:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/%%PATTERN:hb_format%%.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = "";
  ucTagData.pubUrl = "%%PATTERN:url%%";
  ucTagData.cacheHost = "%%PATTERN:hb_cache_host%%";
  ucTagData.cachePath = "%%PATTERN:hb_cache_path%%";
  ucTagData.uuid = "%%PATTERN:hb_cache_id%%";
  ucTagData.mediaType = "%%PATTERN:hb_format%%";
  ucTagData.env = "%%PATTERN:hb_env%%";
  ucTagData.size = "%%PATTERN:hb_size%%";
  ucTagData.hbPb = "%%PATTERN:hb_pb%%";
  try { ucTag.renderAd(document, ucTagData); } catch (e) { console.log(e); }
<\/script>`,
  legacy:`<script>
  // Old pre-PUC creative: only works when the iframe is same-origin (no SafeFrame)
  var w = window;
  for (var i = 0; i < 10; i++) {
    w = w.parent;
    if (w.pbjs) {
      try { w.pbjs.renderAd(document, '%%PATTERN:hb_adid%%'); break; } catch (e) { continue; }
    }
  }
<\/script>`
};

const INFO = {
  direct:`<p>Sponsorship and standard line items sold directly, with delivery goals. They sit above price-priority line items, so a guaranteed campaign that needs the impression beats any header bidding line item regardless of its price.</p><p>AdX can still compete against standard line items through dynamic allocation when it pays enough, as long as the campaign stays on pace.</p>`,
  adx:`<p>Google's own programmatic demand: AdX buyers (Google Ads, DV360, third-party DSPs) plus Open Bidding exchanges, all bidding inside GAM's unified auction.</p><p>Through dynamic allocation they win only if they beat the best eligible non-guaranteed line item, which here is the header bidding line item. That is why header bidding lifts AdX revenue: it sets a real floor.</p>`,
  wins:`<p>GAM applies line item priority first, then price within the same priority tier. The header bidding line item competes as a price-priority line item at the bucket price it was trafficked at, and AdX / Open Bidding compete against it on price.</p>`,
  gamWins:`<p>The header bidding line item lost. GAM serves its own creative (a direct campaign creative or an AdX ad). The Prebid/wrapper bid is never rendered, and no win pixel fires for it.</p>`,
  gamAuction:`<p>One ad request, one decision. GAM filters every line item by targeting (ad unit, size, key-values, geo, frequency caps), then applies priority. A guaranteed line item that needs the impression takes it; otherwise the remaining line items and Google's programmatic demand (AdX, Open Bidding) compete on price.</p><p>Header bidding can only enter this box through line items, or through yield groups with header bidding trafficking. It never bids here directly.</p>`,
  s2sBidder:`<p>An SSP called server-to-server by Prebid Server, not by the browser. It sees the device IP and user agent only if Prebid Server forwards them, and it recognizes the user only if a cookie sync ran earlier. This is the main reason server-side bids can be worth less.</p>`
};

/* ---------- template for "one wrapper -> one line item -> GAM-style auction" ---------- */
function singleFlow(o){
  const c=o.cat;
  return {
    h:630,
    groups:[{x:60,y:308,w:560,h:208,label:o.server||'Google Ad Manager auction',k:o.serverCat||'gam',info:o.gInfo||INFO.gamAuction}],
    nodes:[
      {id:'pg',x:200,y:20,w:280,h:56,t:o.t1,s:o.s1,k:o.c1||c,info:o.i1},
      {id:'ab',x:200,y:116,w:280,h:56,t:o.t2,s:o.s2,k:o.c2||c,info:o.i2},
      {id:'kv',x:170,y:212,w:340,h:56,t:o.t3,s:o.s3,k:o.c3||c,info:o.i3},
      {id:'d',x:80,y:358,w:160,h:56,t:o.dT||'Direct campaigns',s:o.dS||'Guaranteed deals',k:'google',info:o.iD||INFO.direct},
      {id:'li',x:260,y:358,w:160,h:56,t:o.t4,s:o.s4,k:o.c4||c,info:o.i4},
      {id:'ax',x:440,y:358,w:160,h:56,t:o.axT||'AdX / Open Bidding',s:o.axS,k:'google',info:o.iAx||INFO.adx},
      {id:'w',x:220,y:448,w:240,h:44,t:'Highest eligible wins',k:'page',info:o.iW||INFO.wins},
      {id:'ow',x:80,y:556,w:240,h:56,t:o.t5,s:o.s5,k:o.c5||c,exec:true,info:o.i5,go:o.go5},
      {id:'gw',x:360,y:556,w:240,h:56,t:o.gwT||'GAM demand wins',s:o.gwS||'Direct or AdX ad serves',k:'google',exec:true,info:o.iGw||INFO.gamWins}
    ],
    edges:[
      {a:'pg',b:'ab'},{a:'ab',b:'kv'},
      {p:[[340,268],[340,306]]},
      {p:[[160,414],[250,446]]},{p:[[340,414],[340,446]]},{p:[[520,414],[430,446]]},
      {p:[[290,492],[210,554]]},{p:[[390,492],[470,554]]}
    ]
  };
}

/* ---------- all diagrams ---------- */
const D = {
overview:{
  title:'Where the ad decision happens', parent:null, h:380,
  summary:`<p>Every ad slot ends in the same place: an ad server (or, in apps, a mediation platform) picks a winner and a creative runs somewhere. What differs is who collects bids first, how those bids reach the decision-maker, and who draws the winning ad.</p><p>Click any box with a round marker to open its map. Every other box, including the dashed groups, explains itself when clicked.</p>`,
  groups:[
    {x:20,y:20,w:640,h:124,label:'Web pages',k:'frame',
      info:`<p>Display ads on ordinary web pages. The page's JavaScript (Google Publisher Tag, sometimes after a header bidding wrapper) asks an ad server for each slot, and the winning creative renders in an iframe on the page.</p>`},
    {x:20,y:164,w:310,h:196,label:'Mobile apps',k:'frame',
      info:`<p>Native iOS and Android apps. Ads are requested by SDKs compiled into the app rather than page scripts, and creatives render in native views or web views inside the app.</p>`},
    {x:350,y:164,w:310,h:196,label:'Video',k:'frame',
      info:`<p>Video ads are VAST documents, not HTML. A player requests VAST and plays the media file, either on a page with a player (instream), in a player the ad brings along (outstream), or stitched into the stream by a server (CTV / SSAI).</p>`}
  ],
  nodes:[
    {id:'wg',x:40,y:60,w:192,h:64,t:'Publisher + GAM',s:'No header bidding',k:'gam',go:'web-gam'},
    {id:'wh',x:244,y:60,w:192,h:64,t:'HB + ad server',s:'Prebid, Amazon, Fastlane',k:'prebid',go:'web-hb'},
    {id:'amp',x:448,y:60,w:192,h:64,t:'AMP pages',s:'RTC to Prebid Server',k:'prebid',go:'amp'},
    {id:'ap',x:40,y:200,w:270,h:60,t:'Prebid SDK + GAM',s:'Bidding-only or Prebid-rendered',k:'app',go:'app'},
    {id:'md',x:40,y:276,w:270,h:60,t:'Mediation + in-app bidding',s:'AppLovin MAX, AdMob, LevelPlay',k:'app',go:'app-mediation'},
    {id:'vd',x:370,y:200,w:270,h:60,t:'Instream: Prebid + GAM',s:'VAST via Prebid Cache',k:'video',go:'video'},
    {id:'os',x:370,y:276,w:129,h:60,t:'Outstream',s:'Prebid renderer',k:'video',go:'outstream'},
    {id:'ss',x:511,y:276,w:129,h:60,t:'CTV / SSAI',s:'Ads stitched in',k:'video',go:'ssai'}
  ],
  edges:[]
},

'web-gam':{
  title:'Publisher + GAM, no header bidding', parent:'overview', h:530,
  summary:`<p>The baseline. The page asks GAM directly and GAM decides among direct campaigns, remnant line items, and Google's own programmatic demand via dynamic allocation. No outside wrapper competes, so AdX only has to beat the remnant line item prices the publisher set.</p>`,
  groups:[{x:40,y:212,w:600,h:200,label:'GAM ad selection',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'pg',x:200,y:20,w:280,h:56,t:'Page loads GPT',s:'googletag defines slots',k:'page',
      info:`<p>Google Publisher Tag (GPT) defines ad slots, sizes, and page-level targeting, then sends one request to GAM (single-request mode batches all slots).</p>`},
    {id:'rq',x:200,y:116,w:280,h:56,t:'Ad request to GAM',s:'Slot, size, key-values',k:'page',
      info:`<p>The request carries the ad unit path, sizes, page URL, and any custom key-values the publisher set (for example <code>section=sports</code>). Line items can target these.</p>`},
    {id:'d',x:60,y:258,w:180,h:56,t:'Direct / guaranteed',s:'Sponsorship, standard',k:'google',info:INFO.direct},
    {id:'rl',x:250,y:258,w:180,h:56,t:'Remnant line items',s:'Price priority, house',k:'google',
      info:`<p>Price-priority, network, bulk and house line items. With header bidding, this is exactly where the wrapper's line items live.</p>`},
    {id:'ax',x:440,y:258,w:180,h:56,t:'AdX + Open Bidding',s:'Dynamic allocation',k:'google',info:INFO.adx},
    {id:'w',x:220,y:346,w:240,h:44,t:'Highest eligible wins',k:'page',info:INFO.wins},
    {id:'sv',x:200,y:452,w:280,h:56,t:'Winning creative renders',s:'In iframe or SafeFrame',k:'google',exec:true,
      info:`<p>GAM returns the winning creative, and GPT writes it into the slot, either in a friendly (same-origin) iframe or a cross-origin SafeFrame. Third-party creatives (AdX buyers, third-party tags on direct campaigns) execute their own JavaScript here.</p>`}
  ],
  edges:[{a:'pg',b:'rq'},{p:[[340,172],[340,210]]},{p:[[150,314],[260,344]]},{p:[[340,314],[340,344]]},{p:[[530,314],[420,344]]},{p:[[340,390],[340,450]]}],
  code:[{label:'GPT on the page',body:`googletag.cmd.push(function () {
  googletag.defineSlot('/1234/homepage/top', [[300, 250]], 'div-top')
    .addService(googletag.pubads());
  googletag.pubads().setTargeting('section', 'sports');
  googletag.pubads().enableSingleRequest();
  googletag.enableServices();
  googletag.display('div-top');
});`}]
},

'web-hb':{
  title:'Header bidding + ad server', parent:'overview', h:400,
  summary:`<p>A wrapper collects bids in the browser (or on a server) before the ad server is called, then passes the best bid to the ad server as key-values. The ad server treats it like one more line item and decides.</p><p>These are the common setups. They differ in who runs the auction, what keys are sent, and what creative renders the winner.</p>`,
  groups:[{x:20,y:110,w:640,h:270,label:'Common setups',k:'frame',
    info:`<p>Each box is one way of getting outside demand into the ad server's decision. Most large sites combine several: Prebid plus Amazon on the page, some bidders moved to Prebid Server, and Open Bidding switched on inside GAM.</p>`}],
  nodes:[
    {id:'pg',x:170,y:20,w:340,h:56,t:'Page runs header bidding',s:'Before calling the ad server',k:'page',
      info:`<p>The page loads GPT with its initial load disabled (<code>googletag.pubads().disableInitialLoad()</code>) so no ad request goes out yet. Wrappers run their auctions with a timeout, write their results onto the GPT slots as key-values, and only then call <code>googletag.pubads().refresh()</code>.</p>`},

'prebid-gam':{
  title:'Prebid.js + Google Ad Manager', parent:'web-hb', h:640,
  summary:`<p>Prebid runs its auction in the browser, then sends the top bid to GAM as key-values. A Prebid line item priced at that bucket enters GAM's normal selection and competes against direct campaigns and AdX. If it wins, its creative asks Prebid.js to draw the cached bid.</p><p>Click <em>Prebid wins</em> to see how the creative renders.</p>`,
  groups:[{x:60,y:310,w:560,h:208,label:'Google Ad Manager auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'Asks bidders in parallel',k:'prebid',
      info:`<p>Prebid.js sends bid requests to each configured bidder adapter in parallel, waits up to the timeout, then picks the highest bid per ad unit. Late bids are dropped for this auction.</p>`},
    {id:'a',x:90,y:120,w:140,h:44,t:'SSP A: $1.80',k:'prebid',info:`<p>A losing bid. It never renders. With send-all-bids on (Prebid's default) its keys still go to GAM with a bidder suffix (<code>hb_pb_bidderA</code>), which publishers use for reporting or per-bidder line items.</p>`},
    {id:'b',x:270,y:120,w:140,h:44,t:'SSP B: $2.50',k:'prebid',info:`<p>The top bid. Prebid keeps its ad markup in memory and assigns it an <code>adId</code>, which becomes <code>hb_adid</code>. Its price, rounded down to the configured price granularity, becomes <code>hb_pb</code>.</p>`},
    {id:'c',x:450,y:120,w:140,h:44,t:'SSP C: $0.90',k:'prebid',info:`<p>A losing bid. It is never rendered.</p>`},

puc:{
  title:'How the Prebid Universal Creative renders', parent:'prebid-gam', kind:'seq', h:470,
  summary:`<p>The GAM creative contains no ad, only the bid ID. It uses <code>postMessage</code> to ask Prebid.js on the page for that bid, because the iframe is often a cross-origin SafeFrame and can't reach into the page. Prebid.js replies with the ad markup and the creative writes it into its own iframe.</p><p>With no Prebid.js on the page (AMP, apps), the creative instead fetches the ad from Prebid Cache using the <code>hb_cache_*</code> keys.</p>`,
  lanes:[
    {x:130,t:'GAM',k:'google',
      info:`<p>GAM picked the Prebid line item and serves its creative, the Prebid Universal Creative, with the <code>%%PATTERN:hb_adid%%</code> macro replaced by the real bid ID. GPT puts it in an iframe, usually a cross-origin SafeFrame.</p>`},
    {x:340,t:'Creative iframe',k:'prebid',
      info:`<p>The Prebid Universal Creative script runs here. It holds no ad of its own. Because a SafeFrame is cross-origin, it can't call <code>window.parent.pbjs</code>, so it sends a <code>postMessage</code> to the page and waits for the reply.</p>`},
    {x:550,t:'Prebid.js on page',k:'prebid',
      info:`<p>Prebid.js listens for render-request messages from creative frames, looks up the requested bid, and replies to the frame that asked with the ad markup (or ad URL) and its size.</p>`}
  ],
  msgs:[
    {y:110,from:130,to:340,label:'Serves PUC, hb_adid filled'},
    {y:180,from:340,to:550,label:'postMessage: render 3f9a1c'},
    {y:320,from:550,to:340,label:'postMessage: ad markup'}
  ],
  nodes:[
    {id:'lk',x:470,y:210,w:160,h:56,t:'Looks up bid',s:'Marks won, bidWon',k:'prebid',
      info:`<p>Prebid.js finds the bid by <code>adId</code> among bids from the auction, warns if it has already rendered, marks it won, and fires the <code>bidWon</code> event (analytics) and the bidder's win notification if it has one.</p>`},
    {id:'wr',x:260,y:360,w:160,h:56,t:'Writes the ad',s:'SSP B ad appears',k:'prebid',exec:true,
      info:`<p>The creative writes the markup (or loads the ad URL) inside its iframe. The SSP's impression trackers inside the markup fire. The creative can also ask the page to resize the frame.</p>`}
  ],
  code:[{label:'Current GAM creative (PUC)',body:SNIP.puc},{label:'Legacy creative you may still find',body:SNIP.legacy}]
},

amazon:{
  title:'Amazon TAM/UAM + GAM', parent:'web-hb',
  summary:`<p>Amazon's wrapper (<code>apstag</code>) sends one request to Amazon, which runs a server-side auction between Amazon's own demand and the third-party SSPs the publisher enabled. TAM and UAM differ in contracting, not mechanics: TAM publishers contract with and get paid by each SSP; UAM publishers get paid by Amazon.</p><p>The price comes back as an opaque bucket code, not a dollar value, with a mapping from Amazon so line items can be built per bucket. After that the pattern matches Prebid: a line item enters GAM, and its creative asks <code>apstag</code> to render.</p>`,
  ...singleFlow({cat:'amazon',
    t1:'Page calls fetchBids',s1:'apstag, one call to Amazon',i1:`<p><code>apstag.init()</code> then <code>apstag.fetchBids()</code> with the slots and a timeout. Unlike Prebid, there are no per-bidder adapters on the page: all bidding happens on Amazon's servers.</p>`,
    t2:'Amazon returns a bid',s2:'Price as encoded bucket',i2:`<p>The bid price is encoded (for example <code>amznbid=1d4n7k</code>) so the price isn't exposed in the page. The mapping from codes to prices comes from Amazon's portal.</p>`,
    t3:'GPT ad request to GAM',s3:'amznbid, amzniid keys',i3:`<p><code>apstag.setDisplayBids()</code> sets <code>amznbid</code> (encoded price), <code>amzniid</code> (impression ID, used for rendering), <code>amznsz</code> (size) and <code>amznp</code> on the GPT slots.</p>`,
    t4:'Amazon line item',s4:'Targets amznbid bucket',i4:`<p>Price-priority line items, each targeting the <code>amznbid</code> codes that map to its price.</p>`,
    axS:'Must beat Amazon price',
    t5:'Amazon wins',s5:'apstag.renderImp draws ad',i5:`<p>The line item's creative calls <code>apstag.renderImp(document, amzniid)</code> on the parent page's <code>apstag</code>. As with Prebid, the creative is a pointer: <code>apstag</code> holds the ad and writes it into the frame. Amazon's SafeFrame-compatible creative loads its own helper script to do this across origins.</p>`}),
  code:[{label:'Page: Amazon bids into GAM',body:`apstag.init({ pubID: 'YOUR_PUB_ID', adServer: 'googletag' });

apstag.fetchBids({
  slots: [{ slotID: 'div-top', slotName: '/1234/homepage/top', sizes: [[300, 250]] }],
  timeout: 1000
}, function (bids) {
  googletag.cmd.push(function () {
    apstag.setDisplayBids();          // amznbid, amzniid ... on the GPT slots
    googletag.pubads().refresh();
  });
});`},{label:'Shape of the GAM creative (copy the exact one from Amazon’s portal)',body:`<script>
  // Indicative only. apstag lives on the parent page, not in this iframe,
  // so the creative walks up to find it. Amazon also provides a
  // SafeFrame-compatible version that loads its own render helper.
  var w = window;
  for (var i = 0; i < 10; i++) {
    w = w.parent;
    if (w.apstag) {
      try { w.apstag.renderImp(document, '%%PATTERN:amzniid%%'); break; } catch (e) {}
    }
  }
<\/script>`}]
},

fastlane:{
  title:'Magnite (Rubicon) Fastlane + GAM', parent:'web-hb',
  summary:`<p>Fastlane was Rubicon Project's (now Magnite's) own header tag from before wrappers like Prebid took over. One SSP, many buyers behind it. It passes price tiers to GAM as key-values, and matching line items carry a creative that asks the Fastlane tag on the page to render.</p><p>It's legacy now: Magnite demand is usually accessed through Prebid's <code>rubicon</code> adapter or Magnite Demand Manager. You may still find it on older sites.</p>`,
  ...singleFlow({cat:'magnite',
    t1:'Page loads rubicontag',s1:'Magnite Fastlane tag',i1:`<p>The Fastlane library defines slots matching the GPT slots and requests bids from Magnite.</p>`,
    t2:'Magnite returns bids',s2:'Mapped to price tiers',i2:`<p>Bids come back already bucketed into tiers rather than exact prices.</p>`,
    t3:'GPT ad request to GAM',s3:'rpfl_* tier keys',i3:`<p>Keys are named per site/account (for example <code>rpfl_&lt;id&gt;</code>) with values combining a size ID and tier (for example <code>15_tier0250</code>). Check the exact naming in Magnite's documentation for the account.</p>`,
    t4:'Fastlane line item',s4:'Targets tier value',i4:`<p>One price-priority line item per tier, targeting the tier values.</p>`,
    axS:'Must beat the tier',
    t5:'Magnite wins',s5:'rubicontag renders ad',i5:`<p>The creative calls back into the Fastlane tag on the parent page to render the cached Magnite ad, the same pointer pattern as Prebid's legacy creative.</p>`})
},

  summary:`<p>The most common real-world setup on larger sites. Both wrappers run in parallel, the page waits for both (or a shared timeout), and one GAM request carries both key sets. GAM then has two header bidding line items competing with direct and AdX.</p>`,

  code:[{label:'Page: wait for both, then one GAM request',body:`var done = { prebid: false, aps: false };
function sendToGam() {
  if (!done.prebid || !done.aps) return;
  googletag.cmd.push(function () { googletag.pubads().refresh(); });
}

apstag.fetchBids({ slots: apsSlots, timeout: 1000 }, function () {
  googletag.cmd.push(function () {
    apstag.setDisplayBids();
    done.aps = true; sendToGam();
  });
});

pbjs.que.push(function () {
  pbjs.requestBids({
    timeout: 1000,
    bidsBackHandler: function () {
      googletag.cmd.push(function () {
        pbjs.setTargetingForGPTAsync();
        done.prebid = true; sendToGam();
      });
    }
  });
});
// Production code also adds a hard failsafe timer that calls refresh() anyway.`}]
},

pbs:{
  title:'Prebid Server + GAM', parent:'web-hb', h:570,
  summary:`<p>Same GAM side as client-side Prebid, but the bidder calls happen on a server. Prebid.js makes one request to Prebid Server, which calls the SSPs server-to-server and returns their bids, markup included. The page then sends the usual keys to GAM and the same Prebid Universal Creative renders the winner.</p><p>Fewer browser requests and lower page latency; the trade-off is weaker user matching, because SSPs can't read their own cookies unless a cookie sync ran earlier.</p>`,
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'s2sConfig enabled',k:'prebid',
      info:`<p><code>s2sConfig</code> lists which bidders go to the server. Bidders not listed still run client-side in the same auction, so many pages run a hybrid of both.</p>`},
    {id:'ps',x:200,y:116,w:280,h:56,t:'Prebid Server',s:'One call, fans out',k:'prebid',
      info:`<p>Receives one OpenRTB request from Prebid.js, calls the configured bidders server-side in parallel, applies its own timeout, and returns their bids. It can also store creatives in Prebid Cache when asked to.</p>`},
    {id:'a',x:90,y:212,w:140,h:44,t:'SSP A',k:'prebid',info:INFO.s2sBidder},
    {id:'b',x:270,y:212,w:140,h:44,t:'SSP B',k:'prebid',info:INFO.s2sBidder},
    {id:'c',x:450,y:212,w:140,h:44,t:'SSP C',k:'prebid',info:INFO.s2sBidder},
    {id:'bk',x:170,y:296,w:340,h:56,t:'Bids back to the page',s:'Join the client-side auction',k:'prebid',
      info:`<p>Prebid.js receives the server bids, ad markup included, and treats them like any client-side bid. Caching in Prebid Cache is optional for display; it's required where no Prebid.js can render (AMP, apps, video).</p>`},
    {id:'kv',x:170,y:392,w:340,h:56,t:'GPT ad request to GAM',s:'hb_pb, hb_adid, hb_source=s2s',k:'prebid',
      info:`<p>The same keys as client-side Prebid, plus <code>hb_source=s2s</code> so line items or reports can tell server bids apart. <code>hb_cache_id</code> is set only if the bid was cached.</p>`},
    {id:'gm',x:200,y:488,w:280,h:56,t:'Same GAM auction',s:'As in Prebid + GAM',k:'gam',go:'prebid-gam'}
  ],
  edges:[

hbt:{
  title:'GAM header bidding trafficking', parent:'web-hb', h:540,
  summary:`<p>Google's native integration for Prebid (not available on every GAM network). Instead of hundreds of price-bucket line items, the publisher maps Prebid bidders to header bidding partners in yield groups, the same interface used for Open Bidding. GAM reads the bidder and price from the Prebid key-values and puts the bid straight into its unified auction.</p><p>No line items and no header bidding creatives to traffic.</p>`,
  groups:[{x:60,y:212,w:560,h:208,label:'GAM unified auction',k:'gam',
    info:`<p>The same auction as always, but header bidding bids now enter as yield group bids next to Open Bidding and AdX, instead of disguised as price-priority line items.</p>`}],
  nodes:[
    {id:'pj',x:200,y:20,w:280,h:56,t:'Prebid.js on the page',s:'Auction as usual',k:'prebid',
      info:`<p>Nothing changes on the page: Prebid.js runs its auction and sets targeting exactly as in the line item setup. Price granularity still matters because the price travels in the bucketed <code>hb_pb</code> key.</p>`},
    {id:'kv',x:170,y:116,w:340,h:56,t:'GPT ad request to GAM',s:'hb_pb, hb_bidder keys',k:'prebid',
      info:`<p><code>hb_bidder</code> tells GAM which yield partner the bid belongs to, <code>hb_pb</code> gives its price, and <code>hb_adid</code> identifies the bid for rendering.</p>`},
    {id:'d',x:80,y:262,w:160,h:56,t:'Direct campaigns',s:'Guaranteed deals',k:'google',info:INFO.direct},
    {id:'yg',x:260,y:262,w:160,h:56,t:'Yield group',s:'Bidder = hb_bidder',k:'prebid',
      info:`<p>Each Prebid bidder is set up as a header bidding partner in a yield group, the same interface used for Open Bidding. No line items, and reporting shows the Demand Channel as "Header bidding".</p>`},
    {id:'ax',x:440,y:262,w:160,h:56,t:'AdX / Open Bidding',s:'Same auction',k:'google',info:INFO.adx},
    {id:'w',x:220,y:352,w:240,h:44,t:'Highest bid wins',k:'page',info:INFO.wins},
    {id:'o',x:80,y:460,w:240,h:56,t:'Prebid bidder wins',s:'No HB creatives needed',k:'prebid',exec:true,

xandr:{
  title:'Prebid + Microsoft (Xandr) Monetize ad server', parent:'web-hb',
  summary:`<p>The same pattern with a non-Google ad server. Prebid sends keys to Monetize via the AST tag as keywords, Monetize line items target <code>hb_pb</code>, and the creative is the same Prebid Universal Creative with Monetize's <code>#{...}</code> macros instead of GAM's <code>%%PATTERN:...%%</code>.</p><p>Microsoft has been retiring parts of the Xandr stack; check current product status for your account.</p>`,
  ...singleFlow({cat:'xandr',server:'Monetize ad server auction',serverCat:'xandr',
    gInfo:`<p>Monetize's own decisioning: managed (direct) line items, Prebid line items and Monetize's SSP demand compete in one auction, by priority and then price.</p>`,
    t1:'Prebid.js on the page',s1:'Asks bidders in parallel',c1:'prebid',i1:`<p>The same Prebid.js auction as with GAM. Only the ad server integration at the end differs.</p>`,
    t2:'Top bid picked',s2:'hb_pb=2.50, hb_adid',c2:'prebid',i2:`<p>Prebid picks the top bid per ad unit, keeps its markup in memory, and prepares the <code>hb_*</code> keys.</p>`,
    t3:'AST ad request',s3:'Keys sent as keywords',i3:`<p><code>pbjs.setTargetingForAst()</code> copies Prebid's keys onto the Xandr AST tag (<code>apntag</code>) as keywords, then <code>apntag.loadTags()</code> sends the ad request.</p>`,
    dT:'Managed campaigns',dS:'Direct deals',iD:`<p>Direct campaigns managed in Monetize at higher priority than the Prebid line items.</p>`,
    t4:'Prebid line item',s4:'Targets hb_pb=2.50',c4:'prebid',i4:`<p>Price-bucket line items in Monetize, targeting the <code>hb_pb</code> keyword, each carrying the Prebid Universal Creative.</p>`,
    axT:'Monetize demand',axS:'Must beat $2.50',iAx:`<p>Monetize's own SSP demand competes in the same auction.</p>`,
    t5:'Prebid wins',s5:'PUC via #{HB_ADID}',c5:'prebid',go5:'puc',
    gwT:'Monetize wins',gwS:'Its own creative serves',iGw:`<p>The Prebid line item lost. Monetize serves its own direct or programmatic creative, and the Prebid bid is never rendered.</p>`}),
  code:[{label:'Page: Prebid keys into AST',body:`pbjs.que.push(function () {
  pbjs.requestBids({
    bidsBackHandler: function () {
      apntag.anq.push(function () {
        pbjs.setTargetingForAst();   // hb_* keys as AST keywords
        apntag.loadTags();
      });
    }
  });
});`},{label:'Monetize creative (shape; see Prebid docs for the full snippet)',body:`<script src="https://cdn.jsdelivr.net/npm/prebid-universal-creative@latest/dist/#{HB_FORMAT}.js"><\/script>
<script>
  var ucTagData = {};
  ucTagData.adServerDomain = window.location.host;
  ucTagData.pubUrl = "\${REFERER_URL_ENC}";
  ucTagData.adId = "#{HB_ADID}";
  try { ucTag.renderAd(document, ucTagData); } catch (e) { console.log(e); }
<\/script>`}]
},

'open-bidding':{
  title:'Google Open Bidding', parent:'web-hb', h:540,
  summary:`<p>Google's server-side alternative to header bidding. There is no wrapper on the page and no key-values: GPT sends a plain request, and GAM itself calls the Open Bidding exchanges server-to-server while it decides. Their bids compete in the unified auction next to AdX and the line items.</p><p>Google takes a fee on Open Bidding wins, and the publisher only sees what GAM reports.</p>`,
  groups:[{x:40,y:212,w:600,h:208,label:'GAM unified auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'pg',x:200,y:20,w:280,h:56,t:'Page loads GPT',s:'No wrapper on the page',k:'page',
      info:`<p>The page is identical to the no-header-bidding setup. Everything Open Bidding does happens inside Google's servers.</p>`},
    {id:'rq',x:200,y:116,w:280,h:56,t:'Ad request to GAM',s:'No bid keys attached',k:'page',
      info:`<p>A normal GPT request. The Open Bidding partners are configured in GAM as yield groups targeting ad units, sizes and formats.</p>`},
    {id:'d',x:60,y:260,w:128,h:56,t:'Direct',s:'Guaranteed',k:'google',info:INFO.direct},
    {id:'rl',x:204,y:260,w:128,h:56,t:'Remnant LIs',s:'Price priority',k:'google',
      info:`<p>Price-priority, network and house line items. Without a wrapper, these prices are whatever the publisher trafficked.</p>`},
    {id:'ob',x:348,y:260,w:128,h:56,t:'Open Bidding',s:'Exchanges, S2S',k:'google',
      info:`<p>GAM sends a bid request to each exchange in the matching yield group (for example Index, PubMatic, Magnite) server-to-server, with a short timeout. The exchanges return prices and creatives to Google, not to the page.</p>`},
    {id:'ax',x:492,y:260,w:128,h:56,t:'AdX',s:'Google buyers',k:'google',info:INFO.adx},
    {id:'w',x:220,y:352,w:240,h:44,t:'Highest eligible wins',k:'page',info:INFO.wins},
    {id:'o1',x:80,y:460,w:240,h:56,t:'Open Bidding wins',s:'Exchange creative serves',k:'google',exec:true,
      info:`<p>GAM serves the winning exchange's creative directly in its response, like an AdX ad. The buyer's tag, and whatever it loads, runs in the slot's iframe.</p>`},
    {id:'o2',x:360,y:460,w:240,h:56,t:'Other demand wins',s:'Direct, remnant or AdX',k:'google',exec:true,
      info:`<p>A line item or an AdX buyer won. GAM serves that creative, and the Open Bidding exchanges' losing bids are discarded.</p>`}
  ],
  edges:[{a:'pg',b:'rq'},{p:[[340,172],[340,210]]},
    {p:[[124,316],[250,350]]},{p:[[268,316],[320,350]]},{p:[[412,316],[360,350]]},{p:[[556,316],[430,350]]},
    {p:[[290,396],[210,458]]},{p:[[390,396],[470,458]]}]
},

amp:{
  title:'AMP pages: Prebid Server + GAM', parent:'overview',
  summary:`<p>AMP pages can't run Prebid.js. Instead, <code>amp-ad</code> uses Real Time Config (RTC) to call Prebid Server before the GAM request. Prebid Server runs the auction, caches the winning creatives, and returns targeting keys that AMP appends to the GAM request.</p><p>If the Prebid line item wins, the Prebid Universal Creative fetches the ad from Prebid Cache using the cache keys, since there is no Prebid.js on the page to ask.</p>`,
  ...singleFlow({cat:'prebid',
    t1:'amp-ad with rtc-config',s1:'No Prebid.js allowed',c1:'page',i1:`<p>AMP doesn't allow custom JavaScript, so there's no Prebid.js. The <code>amp-ad</code> tag declares an <code>rtc-config</code> pointing at Prebid Server (directly or via a vendor shortcut), and the AMP runtime calls it before requesting the ad.</p>`,
    t2:'Prebid Server auction',s2:'Stored request, bids cached',i2:`<p>Prebid Server's <code>/openrtb2/amp</code> endpoint loads the stored request named by <code>tag_id</code> (which bidders, with which params), runs the auction, stores the bids in Prebid Cache, and returns only targeting keys.</p>`,
    t3:'amp-ad request to GAM',s3:'hb_pb, hb_cache_id appended',i3:`<p>AMP merges the returned targeting into the GAM ad request, the same way GPT would on a normal page. The AMP runtime waits at most the RTC timeout, then sends the request with or without bids.</p>`,
    t4:'Prebid line item',s4:'Targets hb_pb',i4:`<p>Usually the same price-bucket line items as on the web, as long as their creative can fetch from Prebid Cache (the universal creative handles both).</p>`,
    axS:'Must beat Prebid price',
    t5:'Prebid wins',s5:'PUC fetches from cache',i5:`<p>With no Prebid.js on the page, the Prebid Universal Creative reads the <code>hb_cache_*</code> keys and downloads the ad markup from Prebid Cache, then writes it. AMP always renders these ads in a cross-origin iframe.</p>`}),
  code:[{label:'amp-ad calling Prebid Server via RTC',body:`<amp-ad width="300" height="250"
  type="doubleclick"
  data-slot="/1234/amp/top"
  rtc-config='{
    "urls": ["https://prebid-server.example.com/openrtb2/amp?tag_id=amp-top-300x250&w=ATTR(width)&h=ATTR(height)&slot=ATTR(data-slot)&targeting=TGT&curl=CANONICAL_URL&timeout=TIMEOUT&adc=ADCID&purl=HREF&gdpr_consent=CONSENT_STRING"],
    "timeoutMillis": 1000
  }'>
</amp-ad>`},{label:'GAM creative: PUC reading from Prebid Cache',body:SNIP.pucCache}]
},

app:{
  title:'Mobile app: Prebid SDK + GAM', parent:'overview', h:630,
  summary:`<p>In apps, the Prebid SDK asks Prebid Server for bids, then hands keywords to the Google Mobile Ads (GMA) SDK, which calls GAM. GAM decides the same way as on the web. What differs is rendering, and there are two modes.</p><p><em>Bidding-only</em>: GAM serves the Prebid Universal Creative, which fetches the ad from Prebid Cache. <em>Prebid-rendered</em>: GAM serves only a signal, and the Prebid SDK renders the ad itself (with Open Measurement and SKAdNetwork support).</p><p>Apps that use a mediation platform (AppLovin MAX, AdMob, LevelPlay) instead of GAM follow the mediation map.</p>`,
  groups:[{x:60,y:308,w:560,h:208,label:'Google Ad Manager auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'ap',x:200,y:20,w:280,h:56,t:'App requests an ad',s:'Prebid SDK goes first',k:'app',
      info:`<p>Before loading the GAM ad, the app calls the Prebid SDK ad unit's <code>fetchDemand</code> with the GAM ad request object. The GAM load happens in the callback.</p>`},
    {id:'ps',x:200,y:116,w:280,h:56,t:'Prebid Server auction',s:'Bids cached, keywords back',k:'prebid',
      info:`<p>The SDK sends one OpenRTB request, identified by a stored-request config ID, to Prebid Server. It calls the SSPs, caches the winning creatives in Prebid Cache, and returns targeting keywords to the app.</p>`},
    {id:'kv',x:170,y:212,w:340,h:56,t:'GMA SDK request to GAM',s:'hb_pb, hb_cache_id keywords',k:'app',
      info:`<p>The Prebid SDK adds <code>hb_pb</code>, <code>hb_bidder</code>, <code>hb_cache_id</code> and related keys to the GAM request as custom targeting. The GMA SDK then calls GAM.</p>`},
    {id:'d',x:80,y:358,w:160,h:56,t:'Direct campaigns',s:'Guaranteed deals',k:'google',info:INFO.direct},
    {id:'li',x:260,y:358,w:160,h:56,t:'Prebid line item',s:'Targets hb_pb',k:'prebid',
      info:`<p>Price-priority line items per bucket, as on the web. The creative depends on the mode: the universal creative in cache mode for bidding-only, or Prebid's signal creative for Prebid-rendered.</p>`},
    {id:'ax',x:440,y:358,w:160,h:56,t:'AdX / Open Bidding',s:'Must beat Prebid price',k:'google',info:INFO.adx},
    {id:'w',x:220,y:448,w:240,h:44,t:'Highest eligible wins',k:'page',info:INFO.wins},
    {id:'o1',x:64,y:556,w:176,h:56,t:'Bidding-only',s:'PUC loads from cache',k:'prebid',exec:true,
      info:`<p>The GAM creative is the Prebid Universal Creative in cache mode. It reads <code>hb_cache_host</code>, <code>hb_cache_path</code> and <code>hb_cache_id</code> and fetches the ad markup from Prebid Cache, then renders it inside the GMA SDK's web view.</p>`},
    {id:'o2',x:252,y:556,w:176,h:56,t:'Prebid-rendered',s:'Prebid SDK renders',k:'app',exec:true,
      info:`<p>The GAM creative is only a signal that the Prebid line item won (it fires a GAM app event). The GMA SDK passes that to the Prebid SDK's event handler, which renders the cached bid with its own renderer: HTML and MRAID in a web view, video natively.</p>`},
    {id:'o3',x:440,y:556,w:176,h:56,t:'GAM demand wins',s:'GMA SDK renders',k:'google',exec:true,info:INFO.gamWins}
  ],
  edges:[
    {a:'ap',b:'ps'},{a:'ps',b:'kv'},{p:[[340,268],[340,306]]},
    {p:[[160,414],[250,446]]},{p:[[340,414],[340,446]]},{p:[[520,414],[430,446]]},
    {p:[[270,492],[150,554]]},{p:[[340,492],[340,554]]},{p:[[410,492],[530,554]]}
  ],
  code:[{label:'App (Android, Kotlin): Prebid first, then GAM',body:`val adUnit = BannerAdUnit(CONFIG_ID, 300, 250)
val request = AdManagerAdRequest.Builder().build()

adUnit.fetchDemand(request) {
    adView.loadAd(request)   // GAM request now carries hb_* keywords
}`},{label:'GAM creative for bidding-only mode (PUC reads from Prebid Cache)',body:SNIP.pucCache}]
},

'app-mediation':{
  title:'Mobile app: mediation + in-app bidding', parent:'overview', h:640,
  summary:`<p>Most apps don't use an ad server at all. A mediation SDK (AppLovin MAX, Google AdMob, Unity LevelPlay) bundles adapters for many ad network SDKs, and the mediation platform's server runs the auction. Bidding networks compete in real time; older waterfall instances fill in by fixed CPM.</p><p>The winner's own SDK renders the ad inside the app.</p>`,
  groups:[{x:40,y:212,w:600,h:208,label:'Mediation auction',k:'app',
    info:`<p>Run by the mediation platform's server. Bidding networks' prices compete in one auction; in hybrid setups the top bid is also compared with waterfall prices, and waterfall instances priced above it are tried first.</p>`}],
  nodes:[
    {id:'ap',x:200,y:20,w:280,h:56,t:'App requests an ad',s:'Mediation SDK load call',k:'app',
      info:`<p>The app calls the mediation SDK's load method for an ad unit (banner, interstitial, rewarded, native). The network adapters it may use are compiled into the app.</p>`},
    {id:'tk',x:200,y:116,w:280,h:56,t:'Bidder tokens collected',s:'One per bidding network SDK',k:'net',
      info:`<p>Each bidding network's SDK produces a bid token: an encrypted blob of device and user signals. The mediation SDK sends all tokens in one request to the mediation server, instead of each network being called from the device.</p>`},
    {id:'bd',x:60,y:260,w:128,h:56,t:'Bidding',s:'Real-time bids',k:'net',
      info:`<p>Networks such as Meta Audience Network, Unity Ads, Liftoff (Vungle), Mintegral, InMobi, Pangle, DT Exchange and Amazon Publisher Services get the token server-to-server and return a price.</p>`},
    {id:'wf',x:204,y:260,w:128,h:56,t:'Waterfall',s:'CPM-floored lines',k:'net',
      info:`<p>Legacy instances with a fixed or estimated CPM. The SDK calls them one after another from the device until one fills, which is slower and less efficient than bidding. Most platforms now keep only a few.</p>`},
    {id:'gg',x:348,y:260,w:128,h:56,t:'Google demand',s:'AdMob network',k:'google',
      info:`<p>In AdMob mediation, Google's demand competes as the AdMob Network. In MAX or LevelPlay, Google demand plugs in as a bidder or waterfall network like any other.</p>`},
    {id:'ps',x:492,y:260,w:128,h:56,t:'Prebid SDK',s:'Custom adapter',k:'prebid',
      info:`<p>The Prebid SDK can run its Prebid Server auction before the mediation call and pass the price along, so a Prebid custom network entry at that price competes in the mediation auction.</p>`},
    {id:'w',x:220,y:352,w:240,h:44,t:'Highest price wins',k:'page',
      info:`<p>The highest net price wins. The mediation SDK learns which network won and receives that network's bid payload. Win and loss notices go back to the bidders.</p>`},
    {id:'ld',x:200,y:460,w:280,h:56,t:"Winner's SDK loads the ad",s:'Adapter gets the bid payload',k:'net',
      info:`<p>The mediation SDK hands the payload to the winning network's adapter, and that network's SDK fetches or unpacks the creative.</p>`},
    {id:'rd',x:200,y:556,w:280,h:56,t:'Ad renders in the app',s:'Native view or web view',k:'net',exec:true,
      info:`<p>Network SDKs render video and native ads in native views, and HTML, playable and MRAID ads in a web view where their JavaScript runs. The network SDK itself also runs its own code inside the app process.</p>`}
  ],
  edges:[{a:'ap',b:'tk'},{p:[[340,172],[340,210]]},
    {p:[[124,316],[250,350]]},{p:[[268,316],[320,350]]},{p:[[412,316],[360,350]]},{p:[[556,316],[430,350]]},
    {p:[[340,396],[340,458]]},{a:'ld',b:'rd'}],
  code:[{label:'App (Android, AppLovin MAX): auction runs on load',body:`val ad = MaxInterstitialAd("YOUR_AD_UNIT_ID", activity)
ad.setListener(listener)
ad.loadAd()          // tokens collected, mediation auction runs

// later, at a natural break
if (ad.isReady) ad.showAd()`}]
},

video:{
  title:'Instream video: Prebid + GAM', parent:'overview', h:630,
  summary:`<p>Video bids are VAST, not HTML, so they're stored in Prebid Cache first. Prebid then builds a GAM VAST tag URL carrying the keys in <code>cust_params</code>. The player calls GAM, and if the Prebid video line item wins, its creative is a VAST redirect pointing at the cached VAST.</p><p>Outstream video (no player on the page) works differently and has its own map.</p>`,
  groups:[{x:60,y:308,w:560,h:208,label:'Google Ad Manager auction',k:'gam',info:INFO.gamAuction}],
  nodes:[
    {id:'pl',x:200,y:20,w:280,h:56,t:'Player needs a preroll',s:'Instream ad break',k:'video',
      info:`<p>At an ad break the player (usually through Google's IMA SDK) needs a VAST tag URL to request. The page runs Prebid first so that URL can carry bids.</p>`},
    {id:'pj',x:60,y:116,w:260,h:56,t:'Prebid video auction',s:'Bids return VAST',k:'prebid',
      info:`<p>The ad unit uses <code>mediaTypes.video</code> with <code>context: 'instream'</code>. Bidders return VAST XML or a VAST URL rather than HTML.</p>`},
    {id:'ca',x:360,y:116,w:260,h:56,t:'Prebid Cache',s:'Stores VAST, returns ID',k:'prebid',
      info:`<p>Each video bid's VAST XML is stored server-side and mapped to a cache ID (<code>hb_uuid</code> / <code>hb_cache_id</code>). Some bidders cache it themselves before responding.</p>`},
    {id:'url',x:170,y:212,w:340,h:56,t:'GAM VAST tag URL',s:'cust_params: hb_pb, hb_uuid',k:'video',
      info:`<p><code>pbjs.adServers.dfp.buildVideoUrl()</code> returns a GAM video ad tag URL with Prebid keys URL-encoded in <code>cust_params</code>. The player requests this URL.</p>`},
    {id:'d',x:80,y:358,w:160,h:56,t:'Direct video',s:'Guaranteed deals',k:'google',info:INFO.direct},
    {id:'li',x:260,y:358,w:160,h:56,t:'Prebid video LI',s:'Targets hb_pb',k:'prebid',
      info:`<p>Video line items per price bucket targeting <code>hb_pb</code> (usually a separate set from display), each with a VAST redirect creative pointing at Prebid Cache.</p>`},
    {id:'ax',x:440,y:358,w:160,h:56,t:'AdX video',s:'Must beat Prebid price',k:'google',info:INFO.adx},
    {id:'w',x:220,y:448,w:240,h:44,t:'Highest eligible wins',k:'page',info:INFO.wins},
    {id:'o1',x:80,y:556,w:240,h:56,t:'Prebid wins',s:'VAST redirect to cache',k:'prebid',exec:true,
      info:`<p>GAM returns a VAST wrapper whose redirect URL points at Prebid Cache with the cache ID filled in. The player follows it, gets the bidder's VAST, and plays the media. Any JavaScript in the VAST (VPAID, verification scripts) runs in the player's context.</p>`},
    {id:'o2',x:360,y:556,w:240,h:56,t:'GAM demand wins',s:'GAM VAST plays',k:'google',exec:true,info:INFO.gamWins}
  ],
  edges:[
    {p:[[300,76],[190,114]]},{p:[[320,144],[358,144]]},{p:[[190,172],[290,210]]},
    {p:[[340,268],[340,306]]},
    {p:[[160,414],[250,446]]},{p:[[340,414],[340,446]]},{p:[[520,414],[430,446]]},
    {p:[[290,492],[210,554]]},{p:[[390,492],[470,554]]}
  ],
  code:[{label:'Page: build the GAM VAST URL',body:`pbjs.que.push(function () {
  pbjs.addAdUnits(videoAdUnit);
  pbjs.requestBids({
    bidsBackHandler: function () {
      var vastUrl = pbjs.adServers.dfp.buildVideoUrl({
        adUnit: videoAdUnit,
        params: { iu: '/1234/video', output: 'vast' }
      });
      player.playAd(vastUrl);   // your player's ad API
    }
  });
});`},{label:'GAM creative: VAST redirect URL (use your cache host)',body:`https://prebid.adnxs.com/pbc/v1/cache?uuid=%%PATTERN:hb_uuid%%`}]
},

outstream:{
  title:'Outstream video: Prebid + GAM', parent:'overview',
  summary:`<p>Outstream video plays in a regular display slot (in-article, in-feed) with no player on the page. GAM treats it as a display impression. The bid carries a <em>renderer</em>, a script that builds a player and plays the VAST.</p><p>The important difference from banner: when Prebid renders the win, the renderer runs on the publisher page itself, not inside the creative iframe.</p>`,
  ...singleFlow({cat:'prebid',
    t1:'Page has an in-article slot',s1:'A div, no video player',c1:'page',i1:`<p>An ordinary GPT slot between paragraphs, often sized like a banner (for example 640x360, or a fluid 1x1). Nothing on the page knows how to play video yet.</p>`,
    t2:'Prebid video auction',s2:"context: 'outstream'",i2:`<p>The ad unit declares <code>mediaTypes.video</code> with <code>context: 'outstream'</code>. Bidders return VAST. Because there's no player, each bid needs a renderer: either the bidder supplies one or the publisher sets one on the ad unit.</p>`,
    t3:'GPT ad request to GAM',s3:'hb_pb, hb_format=video',i3:`<p>The same <code>hb_*</code> keys as banner, with <code>hb_format=video</code>. Outstream bids usually compete through the display line items (or a set targeting <code>hb_format=video</code>), not the instream video ones.</p>`,
    t4:'Prebid line item',s4:'Display LI with PUC',i4:`<p>A regular display line item with the Prebid Universal Creative. GAM counts a display impression and doesn't know a video will play.</p>`,
    t5:'Prebid wins',s5:'Renderer plays the VAST',i5:`<p>The universal creative asks Prebid.js to render <code>hb_adid</code>. Because the bid has a renderer, Prebid.js loads the renderer script and runs it on the publisher page, and the renderer builds a player in the slot's div and plays the VAST. The renderer, the media and any VPAID or verification scripts all execute here.</p>`}),
  code:[{label:'Outstream ad unit with a publisher renderer',body:`var adUnit = {
  code: 'div-in-article',
  mediaTypes: {
    video: {
      context: 'outstream',
      playerSize: [640, 360],
      mimes: ['video/mp4'],
      protocols: [2, 3, 5, 6],
      plcmt: 4                       // OpenRTB 2.6: no-content / standalone
    }
  },
  renderer: {
    url: 'https://cdn.example.com/outstream-player.js',
    render: function (bid) {
      // Runs on the publisher page: build a player in the slot's div, play the VAST
      window.OutstreamPlayer.play(bid.adUnitCode, bid.vastXml || bid.vastUrl);
    }
  },
  bids: [{ bidder: 'bidderA', params: { placementId: 123 } }]
};`}]
},

ssai:{
  title:'CTV / server-side ad insertion', parent:'overview', h:640,
  summary:`<p>On connected TV and FAST channels the player usually doesn't request ads at all. A server-side ad insertion (SSAI) service sits between player and stream, calls the ad server at each break, and splices the ads into the video stream so they play like content.</p><p>Because everything happens server-to-server, the device's IP, user agent and ad ID must be forwarded, and no creative JavaScript can run.</p>`,
  groups:[{x:40,y:308,w:600,h:208,label:'Video ad server (GAM, FreeWheel, SpringServe…)',k:'gam',
    info:`<p>The ad server fills an ad pod: several slots in one break. It applies priority and price like a display ad server, plus pod rules such as competitive separation, duplicate-creative checks and frequency caps, and answers with VAST (or VMAP).</p>`}],
  nodes:[
    {id:'pl',x:200,y:20,w:280,h:56,t:'Viewer starts a stream',s:'CTV app or FAST channel',k:'video',
      info:`<p>The CTV app plays an HLS or DASH stream. With SSAI the player makes no ad request: it plays whatever the manifest points to. (Some CTV apps use client-side insertion with the IMA SDK instead, which works like web instream.)</p>`},
    {id:'st',x:200,y:116,w:280,h:56,t:'SSAI stitcher hits a break',s:'SCTE-35 or cue points',k:'video',
      info:`<p>The SSAI service (Google DAI, AWS MediaTailor and others) rewrites the stream manifest. It finds ad breaks from SCTE-35 markers in live streams or cue points in VOD. With Google DAI, GAM does both the ad decision and the stitching.</p>`},
    {id:'rq',x:170,y:212,w:340,h:56,t:'Server-side ad request',s:'Viewer IP, UA, device ID forwarded',k:'video',
      info:`<p>The stitcher calls the ad server itself. Because the request comes from a server, it must forward the viewer's IP (<code>X-Forwarded-For</code>), user agent and device advertising ID (IFA) so targeting, frequency capping and fraud checks still work.</p>`},
    {id:'d',x:60,y:356,w:128,h:56,t:'Direct',s:'Guaranteed',k:'google',
      info:`<p>Directly sold TV campaigns, often with strict competitive-separation and frequency rules across the pod.</p>`},
    {id:'sp',x:204,y:356,w:128,h:56,t:'SSP demand',s:'PMPs, open market',k:'net',
      info:`<p>Ad servers such as FreeWheel and SpringServe call SSPs (Magnite, PubMatic, Index and others) server-to-server with the forwarded device data. In GAM, programmatic video demand comes through AdX and Open Bidding instead.</p>`},
    {id:'hb',x:348,y:356,w:128,h:56,t:'Header bidding',s:'Prebid Server pods',k:'prebid',
      info:`<p>Optional. Some stitchers first call Prebid Server's video endpoint for a whole pod and pass the returned <code>hb_*</code> keys to the ad server, just like web header bidding. Prebid line items then compete here.</p>`},
    {id:'ax',x:492,y:356,w:128,h:56,t:'AdX video',s:'Dynamic alloc.',k:'google',info:INFO.adx},
    {id:'w',x:220,y:448,w:240,h:44,t:'Pod filled by price',k:'page',
      info:`<p>Each slot in the pod is filled by priority and price within the pod rules. The ad server returns VAST listing the ads in order, with their media files and tracking URLs.</p>`},
    {id:'sc',x:80,y:556,w:240,h:56,t:'Stitcher inserts the ads',s:'Transcoded into the stream',k:'video',
      info:`<p>The stitcher fetches each ad's media file, transcodes it to match the stream, and splices it into the manifest, so the player sees one continuous stream. VPAID and other JavaScript creatives can't be stitched, so no creative code runs in SSAI: only media files and tracking URLs are used.</p>`},
    {id:'bc',x:360,y:556,w:240,h:56,t:'Tracking beacons fire',s:'Server-side or client-side',k:'video',
      info:`<p>Impression and quartile URLs from the VAST are called either by the stitcher (server-side beaconing, with the viewer's IP and UA forwarded) or by the player after the stitcher passes them down (client-side beaconing, which some verification vendors require).</p>`}
  ],
  edges:[
    {a:'pl',b:'st'},{a:'st',b:'rq'},{p:[[340,268],[340,306]]},
    {p:[[124,412],[250,446]]},{p:[[268,412],[320,446]]},{p:[[412,412],[360,446]]},{p:[[556,412],[430,446]]},
    {p:[[290,492],[210,554]]},{a:'sc',b:'bc'}
  ],
  code:[{label:"Shape of a stitcher's VAST request to GAM (see GAM's SSAI docs for required params)",body:`GET /gampad/ads?iu=/1234/ctv/midroll&output=vast&vpos=midroll&ss_req=1
      &rdid=<device IFA>&idtype=<rida|afai|...>&is_lat=0
      &msid=<app bundle>&an=<app name>
Host: pubads.g.doubleclick.net
User-Agent: <viewer device UA>
X-Forwarded-For: <viewer IP>`}]
}
};

/* ---------- rendering ---------- */
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current=null, selected=null;

function edgePath(e,nodes){
  let pts=e.p;
  if(!pts){
    const a=nodes.find(n=>n.id===e.a), b=nodes.find(n=>n.id===e.b);
    if(b.y>=a.y+a.h-1) pts=[[a.x+a.w/2+(e.ao||0),a.y+a.h],[b.x+b.w/2+(e.bo||0),b.y-2]];
    else if(b.x>a.x) pts=[[a.x+a.w,a.y+a.h/2],[b.x-2,b.y+b.h/2]];
    else pts=[[a.x,a.y+a.h/2],[b.x+b.w+2,b.y+b.h/2]];
  }
  return 'M'+pts.map(p=>p.join(' ')).join(' L');
}

function nodeSVG(n){
  const cx=n.x+n.w/2, cy=n.y+n.h/2, clk=!!(n.go||n.info);
  let s=`<g class="n k-${n.k}${clk?' clk':''}" data-id="${n.id}" ${clk?'tabindex="0" role="button"':''} aria-label="${esc(n.t)}${n.go?' (open map)':''}">`;
  if(n.exec) s+=`<rect class="x" x="${n.x-4}" y="${n.y-4}" width="${n.w+8}" height="${n.h+8}" rx="10"/>`;
  s+=`<rect class="b" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>`;
  if(n.s){
    s+=`<text class="tt" x="${cx}" y="${cy-10}" text-anchor="middle" dominant-baseline="central">${esc(n.t)}</text>`;
    s+=`<text class="tu" x="${cx}" y="${cy+10}" text-anchor="middle" dominant-baseline="central">${esc(n.s)}</text>`;
  } else s+=`<text class="tt" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central">${esc(n.t)}</text>`;
  if(n.go){
    const bx=n.x+n.w-11, by=n.y+11;
    s+=`<g class="dr"><circle cx="${bx}" cy="${by}" r="7"/><path d="M${bx-2} ${by-3} L${bx+1.5} ${by} L${bx-2} ${by+3}"/></g>`;
  }
  return s+'</g>';
}

function render(id){
  const d=D[id]; if(!d){location.hash='#overview';return;}
  current=id; selected=null;
  let s=`<svg viewBox="0 0 680 ${d.h}" role="img" aria-labelledby="svgt"><title id="svgt">${esc(d.title)}</title>`;
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  (d.groups||[]).forEach((g,i)=>{
    const clk=!!g.info;
    s+=`<g class="g k-${g.k}${g.k==='frame'?' frame':''}${clk?' clk':''}" data-id="@g${i}" ${clk?`tabindex="0" role="button" aria-label="${esc(g.label)}"`:''}><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="14"/>`;
    s+= g.k==='frame' ? `<text class="gl" x="${g.x+16}" y="${g.y+22}">${esc(g.label)}</text>` : `<text class="gl" x="${g.x+g.w/2}" y="${g.y+24}" text-anchor="middle">${esc(g.label)}</text>`;
    s+='</g>';
  });
  if(d.kind==='seq'){
    d.lanes.forEach((l,i)=>{
      s+=`<line class="ll" x1="${l.x}" y1="64" x2="${l.x}" y2="${d.h-20}"/>`;
      s+=nodeSVG({id:'@l'+i,x:l.x-80,y:20,w:160,h:44,t:l.t,k:l.k,info:l.info});
    });
    d.msgs.forEach(m=>{
      const dir=m.to>m.from?1:-1;
      s+=`<text class="ml" x="${(m.from+m.to)/2}" y="${m.y-12}" text-anchor="middle">${esc(m.label)}</text>`;
      s+=`<line class="e" x1="${m.from+2*dir}" y1="${m.y}" x2="${m.to-4*dir}" y2="${m.y}" marker-end="url(#ar)"/>`;
    });
  }
  (d.edges||[]).forEach(e=>{ s+=`<path class="e" d="${edgePath(e,d.nodes)}" marker-end="url(#ar)"/>`; });
  d.nodes.forEach(n=>{ s+=nodeSVG(n); });
  s+='</svg>';
  const cv=document.getElementById('canvas'); cv.innerHTML=s;
  cv.querySelectorAll('.clk').forEach(el=>{
    const act=()=>activate(el.dataset.id);
    el.addEventListener('click',act);
    el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act();} });
  });
  renderCrumbs(); renderNav(); renderPanel();
  document.title=d.title+' | Ad decision maps';
}

/* nodes, sequence lanes (@l<i>) and groups (@g<i>) are all selectable */
function items(d){
  return [...(d.nodes||[]),
    ...(d.lanes||[]).map((l,i)=>({id:'@l'+i,t:l.t,k:l.k,info:l.info})),
    ...(d.groups||[]).map((g,i)=>({id:'@g'+i,t:g.label,k:g.k,info:g.info}))];
}

function activate(nid){
  const n=items(D[current]).find(x=>x.id===nid); if(!n) return;
  if(n.go){ location.hash='#'+n.go; return; }
  selected=nid;
  document.querySelectorAll('#canvas [data-id]').forEach(el=>el.classList.toggle('on',el.dataset.id===nid));
  renderPanel();
  // stacked layout: the panel sits below the diagram, so bring the explanation into view
  if(window.matchMedia('(max-width:1180px)').matches){
    const sel=document.querySelector('#panel .sel');
    if(sel) sel.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function chain(id){ const c=[]; while(id){ c.unshift(id); id=D[id].parent; } return c; }

function renderCrumbs(){
  const c=chain(current);
  document.getElementById('crumbs').innerHTML=c.map((id,i)=> i===c.length-1
    ? `<span class="cur">${esc(D[id].title)}</span>`
    : `<a href="#${id}">${esc(D[id].title)}</a><span aria-hidden="true">/</span>`).join(' ');
}

function renderNav(){
  const kids=p=>Object.keys(D).filter(k=>D[k].parent===p);
  const tree=p=>{ const k=kids(p); if(!k.length) return '';
    return '<ul>'+k.map(id=>`<li><a href="#${id}" class="${id===current?'on':''}">${esc(D[id].title)}</a>${tree(id)}</li>`).join('')+'</ul>'; };
  document.getElementById('nav').innerHTML=`<ul><li><a href="#overview" class="${current==='overview'?'on':''}">${esc(D.overview.title)}</a>${tree('overview')}</li></ul>`;
}

function renderPanel(){
  const d=D[current];
  let h=`<h2>${esc(d.title)}</h2>${d.summary||''}`;
  const n=selected && items(d).find(x=>x.id===selected);
  if(n){
    h+=`<div class="sel"><h3>${esc(n.t)}</h3>${n.info||''}${n.exec?'<p class="exec">Third-party creative code executes here.</p>':''}</div>`;
  } else {
    h+=`<div class="sel empty">Click any box or group to see what happens there. Boxes with a round marker open a deeper map.</div>`;
  }
  const cats=[...new Set([...(d.nodes||[]).map(x=>x.k),...(d.lanes||[]).map(x=>x.k),...(d.groups||[]).map(x=>x.k)])].filter(k=>CATS[k]);
  const hasExec=(d.nodes||[]).some(x=>x.exec), hasGo=(d.nodes||[]).some(x=>x.go);
  h+=`<div class="legend">`+cats.map(k=>`<span><i class="k-${k}" style="background:var(--f);border-color:var(--s)"></i>${esc(CATS[k])}</span>`).join('')
    +(hasExec?`<span><i class="x"></i>Creative code runs here</span>`:'')
    +(hasGo?`<span><i class="d k-page" style="background:var(--ink2);border-color:var(--ink2)"></i>Opens a deeper map</span>`:'')+`</div>`;
  (d.code||[]).forEach((c,i)=>{
    h+=`<h3>${i===0?'Code':''}</h3>`.replace('<h3></h3>','');
    h+=`<div class="codeblock"><div class="bar"><span>${esc(c.label)}</span><button type="button" data-i="${i}">Copy</button></div><pre><code>${esc(c.body)}</code></pre></div>`;
  });
  const p=document.getElementById('panel'); p.innerHTML=h;
  p.querySelectorAll('.codeblock button').forEach(b=>b.addEventListener('click',()=>{
    const body=d.code[+b.dataset.i].body;
    (navigator.clipboard?navigator.clipboard.writeText(body):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400);})
      .catch(()=>{b.textContent='Select and copy';});
  }));
}

window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'overview'));
render(location.hash.slice(1)||'overview');
</script>
</body>
</html>
